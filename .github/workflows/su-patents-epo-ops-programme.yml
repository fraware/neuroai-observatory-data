name: SU-PATENTS EPO OPS programme

on:
  pull_request:
    paths:
      - "curation/epo_ops_patent_discovery_programme_v0.1.json"
      - "curation/source_universe_registry_v0.1.json"
      - "schemas/epo-ops-patent-discovery-programme.schema.json"
      - "scripts/validate_epo_ops_patent_discovery_programme.py"
      - "tests/test_epo_ops_patent_discovery_programme.py"
      - ".github/workflows/su-patents-epo-ops-programme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-programme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Parse programme and schema
        run: |
          python -m json.tool curation/epo_ops_patent_discovery_programme_v0.1.json >/dev/null
          python -m json.tool schemas/epo-ops-patent-discovery-programme.schema.json >/dev/null
      - name: Validate bounded EPO OPS programme
        run: python scripts/validate_epo_ops_patent_discovery_programme.py
      - name: Run programme tests
        run: python -m unittest tests.test_epo_ops_patent_discovery_programme
      - name: Enforce no live or authority claim
        run: |
          python - <<'PY'
          import json
          p=json.load(open('curation/epo_ops_patent_discovery_programme_v0.1.json',encoding='utf-8'))
          assert p['workbench_dependency']['integration_state']=='AVAILABLE'
          assert p['provider_contract']['configuration_performs_http'] is False
          assert p['network_policy']['credentials_or_tokens_may_be_committed'] is False
          assert p['search_partition_policy']['silent_truncation_allowed'] is False
          assert p['inclusion_policy']['automatic_patent_source_admission'] is False
          assert p['inclusion_policy']['automatic_product_or_system_relationship_creation'] is False
          assert p['coverage_contract']['global_neuroai_patent_recall_claim'] is False
          PY
