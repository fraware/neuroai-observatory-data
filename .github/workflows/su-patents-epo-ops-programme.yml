name: SU-PATENTS EPO OPS programme

on:
  pull_request:
    paths:
      - "curation/epo_ops_patent_discovery_programme_v0.1.json"
      - "curation/source_universe_registry_v0.1.json"
      - "schemas/epo-ops-patent-discovery-programme.schema.json"
      - "scripts/validate_epo_ops_patent_discovery_programme.py"
      - "tests/test_epo_ops_patent_discovery_programme.py"
      - ".github/workflows/su-patents-epo-ops-programme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-programme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse patent programme schema
        run: python -c "import json; json.load(open('schemas/epo-ops-patent-discovery-programme.schema.json'))"
      - name: Validate patent programme
        run: python scripts/validate_epo_ops_patent_discovery_programme.py
      - name: Run patent programme tests
        run: python -m unittest tests/test_epo_ops_patent_discovery_programme.py -v
      - name: Prove credentials and live collection are not part of programme control
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('curation/epo_ops_patent_discovery_programme_v0.1.json').read_text())
          assert p['network_policy']['configuration_performs_http'] is False
          assert p['network_policy']['credentials_or_tokens_may_be_committed'] is False
          assert p['workbench_dependency']['integration_state'] == 'NOT_IMPLEMENTED'
          PY
