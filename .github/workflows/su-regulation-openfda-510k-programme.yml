name: SU-REGULATION openFDA 510(k) programme
on:
  pull_request:
    paths:
      - 'curation/openfda_510k_discovery_programme_v0.1.json'
      - 'schemas/openfda-510k-discovery-programme.schema.json'
      - 'scripts/validate_openfda_510k_discovery_programme.py'
      - 'tests/test_openfda_510k_discovery_programme.py'
      - 'curation/source_universe_registry_v0.1.json'
      - '.github/workflows/su-regulation-openfda-510k-programme.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-programme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m json.tool curation/openfda_510k_discovery_programme_v0.1.json >/dev/null
      - run: python -m json.tool schemas/openfda-510k-discovery-programme.schema.json >/dev/null
      - run: python scripts/validate_openfda_510k_discovery_programme.py
      - run: python -m unittest tests.test_openfda_510k_discovery_programme
      - name: Assert pathway and decision boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('curation/openfda_510k_discovery_programme_v0.1.json'))
          assert p['workbench_dependency']['integration_state']=='AVAILABLE'
          assert p['identity_policy']['admitted_prefixes']==['K','BK']
          assert p['identity_policy']['den_prefix_is_de_novo_and_out_of_scope_for_v0_1'] is True
          assert p['decision_semantics_policy']['recognized_substantial_equivalence_codes']==['SEKD','SESD','SESE','SESK','SESP','SESU','SESR']
          assert p['decision_semantics_policy']['description_only_inference_allowed'] is False
          assert p['coverage_contract']['record_presence_is_clearance_claim'] is False
          assert p['coverage_contract']['clearance_is_pma_approval_claim'] is False
          assert p['inclusion_policy']['automatic_reopening_decision'] is False
          PY
