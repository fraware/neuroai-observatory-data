name: SU-REGULATION openFDA 510k programme
on:
  pull_request:
    paths:
      - "curation/openfda_510k_discovery_programme_v0.1.json"
      - "schemas/openfda-510k-discovery-programme.schema.json"
      - "scripts/validate_openfda_510k_discovery_programme.py"
      - "tests/test_openfda_510k_discovery_programme.py"
      - ".github/workflows/su-regulation-openfda-510k-programme.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_openfda_510k_discovery_programme.py
      - run: python -m unittest tests/test_openfda_510k_discovery_programme.py
      - name: Refuse raw 510k captures
        run: |
          if find . -path './.git' -prune -o -type f \( -iname '*510k*raw*.json' -o -iname '*510k*response*.json' -o -iname '*510k*page*.json' \) -print | grep -q .; then
            echo "Raw openFDA 510(k) captures must remain external/ephemeral." >&2
            exit 1
          fi
