name: Analytical projection

on:
  pull_request:
    paths:
      - "scripts/build_analytical_projection.py"
      - "scripts/build_monitoring_eligibility.py"
      - "scripts/validate_legacy_source_registration.py"
      - "scripts/project_legacy_source_registration_impact.py"
      - "scripts/project_legacy_source_monitoring.py"
      - "scripts/build_legacy_source_promotion_queue.py"
      - "scripts/source_namespace_eligibility.py"
      - "tests/test_build_analytical_projection.py"
      - "tests/test_build_monitoring_eligibility.py"
      - "tests/test_build_legacy_source_registration.py"
      - "tests/test_build_legacy_source_registration_provenance.py"
      - "tests/test_build_legacy_source_registration_impact.py"
      - "tests/test_build_legacy_source_monitoring.py"
      - "tests/test_build_legacy_source_promotion_queue.py"
      - "tests/test_build_source_namespace_eligibility.py"
      - "curation/legacy_assessment_source_registration_proposals_v0.1.json"
      - "curation/legacy_assessment_source_registration_provenance_v0.1.json"
      - "curation/source_namespace_eligibility_policy_v0.1.json"
      - "schemas/legacy-source-registration-proposals.schema.json"
      - ".github/workflows/analytical-projection.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build_analytical_projection.py"
      - "scripts/build_monitoring_eligibility.py"
      - "scripts/validate_legacy_source_registration.py"
      - "scripts/project_legacy_source_registration_impact.py"
      - "scripts/project_legacy_source_monitoring.py"
      - "scripts/build_legacy_source_promotion_queue.py"
      - "scripts/source_namespace_eligibility.py"
      - "tests/test_build_analytical_projection.py"
      - "tests/test_build_monitoring_eligibility.py"
      - "tests/test_build_legacy_source_registration.py"
      - "tests/test_build_legacy_source_registration_provenance.py"
      - "tests/test_build_legacy_source_registration_impact.py"
      - "tests/test_build_legacy_source_monitoring.py"
      - "tests/test_build_legacy_source_promotion_queue.py"
      - "tests/test_build_source_namespace_eligibility.py"
      - "curation/legacy_assessment_source_registration_proposals_v0.1.json"
      - "curation/legacy_assessment_source_registration_provenance_v0.1.json"
      - "curation/source_namespace_eligibility_policy_v0.1.json"
      - "schemas/legacy-source-registration-proposals.schema.json"
      - ".github/workflows/analytical-projection.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_build_*.py' -v
      - name: Validate legacy source registration proposals
        run: python scripts/validate_legacy_source_registration.py
      - name: Verify legacy source registration checkpoint
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("curation/legacy_assessment_source_registration_proposals_v0.1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          metadata = payload["derived_from"]
          proposals = payload["proposals"]
          actions = Counter(row["action"] for row in proposals)

          assert metadata["source_universe_count"] == 248, metadata
          assert metadata["assessment_evidence_count"] == 52, metadata
          assert metadata["deterministic_matched_evidence_count"] == 15, metadata
          assert metadata["unresolved_evidence_count"] == 37, metadata
          assert metadata["registration_eligible_evidence_count"] == 35, metadata
          assert metadata["exact_identity_source_proposal_count"] == 33, metadata
          assert metadata["missing_explicit_source_count"] == 1, metadata
          assert metadata["curation_required_count"] == 1, metadata
          assert metadata["fuzzy_matching"] is False, metadata
          assert len(proposals) == 35, len(proposals)
          assert actions == {
              "REGISTER_NEW_SOURCE": 33,
              "REGISTER_MISSING_EXPLICIT_SOURCE": 1,
              "CURATION_REQUIRED": 1,
          }, actions
          assert sum(
              len(row["linked_evidence"])
              for row in proposals
              if row["action"] == "REGISTER_NEW_SOURCE"
          ) == 35
          assert sum(len(row["linked_evidence"]) for row in proposals) == 37

          print("LEGACY SOURCE REGISTRATION — MECHANICAL CANDIDATE LAYER")
          print("source universe: 248")
          print("assessment evidence: 52")
          print("deterministically matched: 15")
          print("unresolved: 37")
          print("exact-key candidate evidence: 35")
          print("raw exact source proposals: 33")
          print("missing explicit source: 1")
          print("mechanical curation-only: 1")
          PY
      - name: Project legacy source registration impact
        run: >-
          python scripts/project_legacy_source_registration_impact.py
          --output-dir "$RUNNER_TEMP/legacy-source-registration-impact"
      - name: Verify prospective identity-safe impact
        env:
          IMPACT_ROOT: ${{ runner.temp }}/legacy-source-registration-impact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["IMPACT_ROOT"])
          payload = json.loads((root / "legacy-source-registration-impact.json").read_text(encoding="utf-8"))
          candidates = payload["candidate_state"]
          proposal_state = payload["proposal_state"]
          policy = payload["source_namespace_policy"]
          scenario = payload["full_identity_safe_acceptance_scenario"]
          remaining = payload["remaining_unresolved_evidence"]
          packet = payload["review_packet"]

          assert payload["status"] == "NONCANONICAL_PROJECTION", payload["status"]
          assert payload["scenario_only"] is True
          assert policy["status"] == "NONCANONICAL_POLICY", policy
          assert policy["precedence"] == "SOURCE_NAMESPACE_ELIGIBILITY_OVERRIDES_MECHANICAL_REGISTRATION_ACTION", policy

          assert candidates["exact_key_candidate_evidence_count"] == 35, candidates
          assert candidates["source_namespace_eligible_exact_key_evidence_count"] == 34, candidates
          assert proposal_state["effective_action_counts"] == {
              "CURATION_REQUIRED": 2,
              "REGISTER_MISSING_EXPLICIT_SOURCE": 1,
              "REGISTER_NEW_SOURCE": 32,
          }, proposal_state

          assert scenario["newly_joinable_evidence_count"] == 35, scenario
          assert scenario["projected_deterministically_matched_evidence_count"] == 50, scenario
          assert scenario["projected_joinability"] == {"numerator": 50, "denominator": 52}, scenario
          assert scenario["projected_unresolved_evidence_count"] == 2, scenario
          assert scenario["projected_added_source_identity_count"] == 33, scenario
          assert scenario["projected_effective_source_count"] == 281, scenario
          assert scenario["canonical_status"] == "SCENARIO_ONLY_NOT_CURRENT_CANONICAL_DATA", scenario

          unresolved = {
              (row["system"], row["evidence_id"], row["reason"])
              for row in remaining
          }
          assert unresolved == {
              ("BrainGate2 T15", "EV-T15-012", "ASSESSMENT_LOCAL_CONTROLLED_ADJUDICATION"),
              ("FDA adaptive DBS", "EV-15", "MECHANICAL_CURATION_REQUIRED"),
          }, remaining

          assert {row["review_disposition"] for row in packet} <= {
              "READY_FOR_IDENTITY_REVIEW",
              "CURATION_REQUIRED",
          }
          assert all(
              row["monitoring_disposition"] == "UNCLASSIFIED_PENDING_SEPARATE_MONITORING_REVIEW"
              for row in packet
          )
          assert sorted(
              row["requested_source_id"]
              for row in packet
              if row["requested_source_id"]
          ) == ["SRC-PR-011"]

          braingate = next(row for row in packet if row["linked_evidence_ids"] == ["EV-T15-012"])
          assert braingate["raw_action"] == "REGISTER_NEW_SOURCE", braingate
          assert braingate["effective_action"] == "CURATION_REQUIRED", braingate
          assert braingate["source_namespace_eligible"] is False, braingate
          assert braingate["checksum_is_provenance_only"] is True, braingate
          assert braingate["eligibility_reason"] == "ASSESSMENT_LOCAL_CONTROLLED_ADJUDICATION", braingate

          fda = next(row for row in packet if row["linked_evidence_ids"] == ["EV-15"])
          assert fda["raw_action"] == "CURATION_REQUIRED", fda
          assert fda["effective_action"] == "CURATION_REQUIRED", fda
          assert fda["source_namespace_eligible"] is False, fda
          assert fda["eligibility_reason"] == "MECHANICAL_CURATION_REQUIRED", fda

          print("LEGACY REGISTRATION IMPACT — POLICY AWARE")
          print("current joinability: 15/52")
          print("mechanical exact-key candidate evidence: 35")
          print("namespace-eligible exact-key evidence: 34")
          print("newly joinable if identity-safe proposals are later accepted: 35")
          print("projected joinability: 50/52")
          print("remaining unresolved: FDA EV-15; BrainGate EV-T15-012")
          print("projected effective sources: 281 (scenario only)")
          PY
      - name: Project prospective legacy source monitoring
        run: >-
          python scripts/project_legacy_source_monitoring.py
          --output-dir "$RUNNER_TEMP/legacy-source-monitoring"
      - name: Verify prospective legacy monitoring classification
        env:
          LEGACY_MONITORING_ROOT: ${{ runner.temp }}/legacy-source-monitoring
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["LEGACY_MONITORING_ROOT"])
          payload = json.loads((root / "legacy-source-prospective-monitoring.json").read_text(encoding="utf-8"))
          population = payload["prospective_population"]
          rows = payload["sources"]
          excluded = payload["excluded_curation_holds"]

          assert payload["status"] == "NONCANONICAL_PROJECTION"
          assert payload["scenario_only"] is True
          assert payload["registration_status"] == "NOT_REGISTERED"
          assert payload["monitor_status"] == "PROSPECTIVE_ONLY"
          assert population["source_identity_count"] == 33, population
          assert population["excluded_curation_hold_count"] == 2, population
          assert population["mode_counts"] == {
              "ARCHIVAL_STATIC": 22,
              "ON_CHANGE": 7,
              "RECURRING": 4,
          }, population
          assert population["rule_counts"] == {
              "DATED_PUBLICATION_OR_EVENT_ARTIFACT": 9,
              "IMMUTABLE_GIT_OBJECT": 6,
              "LIVE_PROJECT_OR_REPOSITORY_PAGE": 2,
              "LIVE_REGULATORY_DATABASE": 5,
              "LIVE_TRIAL_REGISTRY": 4,
              "STATIC_FILE_OR_VERSIONED_DOCUMENT": 7,
          }, population
          assert len(rows) == 33
          assert len({row["proposal_id"] for row in rows}) == 33
          assert all(row["source_namespace_eligible"] is True for row in rows)
          assert all(row["registration_status"] == "NOT_REGISTERED" for row in rows)
          assert all(row["monitor_status"] == "PROSPECTIVE_ONLY" for row in rows)
          assert sorted(row["requested_source_id"] for row in rows if row["requested_source_id"]) == ["SRC-PR-011"]
          assert all(
              not row["requested_source_id"] and not row["existing_source_id"]
              for row in rows
              if row["effective_source_action"] == "REGISTER_NEW_SOURCE"
          )

          excluded_evidence = {
              (system, evidence_id)
              for row in excluded
              for system in row["systems"]
              for evidence_id in row["linked_evidence_ids"]
          }
          assert excluded_evidence == {
              ("FDA adaptive DBS", "EV-15"),
              ("BrainGate2 T15", "EV-T15-012"),
          }, excluded

          def row_for(system, evidence_id):
              matches = [
                  row for row in rows
                  if system in row["systems"] and evidence_id in row["linked_evidence_ids"]
              ]
              assert len(matches) == 1, (system, evidence_id, matches)
              return matches[0]

          assert row_for("FDA adaptive DBS", "EV-06")["monitoring_mode"] == "RECURRING"
          assert row_for("BrainGate2 T15", "EV-T15-002")["monitoring_mode"] == "RECURRING"
          assert row_for("Brain2Qwerty", "EV-01")["monitoring_mode"] == "ARCHIVAL_STATIC"
          assert row_for("Brain2Qwerty", "EV-04")["monitoring_mode"] == "ARCHIVAL_STATIC"
          assert row_for("Brain2Qwerty", "EV-02")["monitoring_mode"] == "ON_CHANGE"
          assert row_for("PRIMA", "EV-PR-011")["monitoring_mode"] == "ARCHIVAL_STATIC"

          checkpoint = payload["current_canonical_monitoring_checkpoint"]
          assert checkpoint == {
              "effective_source_count": 248,
              "monitor_registry_source_count": 224,
              "unmonitored_effective_source_count": 24,
              "mutated_by_this_projection": False,
          }, checkpoint

          print("PROSPECTIVE LEGACY MONITORING")
          print(f"source identities: {population['source_identity_count']}")
          print(f"excluded curation holds: {population['excluded_curation_hold_count']}")
          for mode, count in population["mode_counts"].items():
              print(f"{mode}: {count}")
          print("RULE COUNTS")
          for rule, count in population["rule_counts"].items():
              print(f"{rule}: {count}")
          PY
      - name: Build legacy source promotion-readiness queue
        run: >-
          python scripts/build_legacy_source_promotion_queue.py
          --output-dir "$RUNNER_TEMP/legacy-source-promotion-readiness"
      - name: Verify promotion-readiness queue
        env:
          PROMOTION_QUEUE_ROOT: ${{ runner.temp }}/legacy-source-promotion-readiness
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PROMOTION_QUEUE_ROOT"])
          payload = json.loads((root / "legacy-source-promotion-readiness.json").read_text(encoding="utf-8"))
          checkpoint = payload["queue_checkpoint"]
          rows = payload["rows"]

          assert payload["status"] == "NONCANONICAL_REVIEW_QUEUE"
          assert payload["approval_status"] == "NOT_APPROVED"
          assert payload["canonical_status"] == "NOT_CANONICAL"
          assert payload["human_review_status"] == "UNREVIEWED"
          assert checkpoint["queue_row_count"] == 35, checkpoint
          assert checkpoint["linked_unresolved_evidence_row_count"] == 37, checkpoint
          assert checkpoint["lane_counts"] == {
              "CURATION_REQUIRED": 2,
              "LIVE_SOURCE_REFRESH_REQUIRED": 11,
              "STATIC_IDENTITY_AND_METADATA_REVIEW": 22,
          }, checkpoint
          assert checkpoint["eligible_monitoring_mode_counts"] == {
              "ARCHIVAL_STATIC": 22,
              "ON_CHANGE": 7,
              "RECURRING": 4,
          }, checkpoint
          assert len(rows) == 35
          assert len({row["proposal_id"] for row in rows}) == 35
          assert len({evidence for row in rows for evidence in row["assessment_scoped_evidence_ids"]}) == 37
          assert all(row["approval_status"] == "NOT_APPROVED" for row in rows)
          assert all(row["canonical_status"] == "NOT_CANONICAL" for row in rows)
          assert all(row["human_review_status"] == "UNREVIEWED" for row in rows)
          assert all(row["reviewer_identity"] is None and row["decision_record_id"] is None for row in rows)
          assert sorted(row["requested_source_id"] for row in rows if row["requested_source_id"]) == ["SRC-PR-011"]

          mutable = [row for row in rows if row["monitoring_mode"] in {"ON_CHANGE", "RECURRING"}]
          static = [row for row in rows if row["monitoring_mode"] == "ARCHIVAL_STATIC"]
          curation = [row for row in rows if row["review_lane"] == "CURATION_REQUIRED"]
          assert len(mutable) == 11 and all(row["refresh_status"] == "REQUIRED" for row in mutable)
          assert len(static) == 22 and all(row["refresh_status"] == "NOT_REQUIRED" for row in static)
          assert len(curation) == 2 and all(row["refresh_status"] == "NOT_APPLICABLE" for row in curation)
          assert {
              evidence
              for row in curation
              for evidence in row["assessment_scoped_evidence_ids"]
          } == {"BrainGate2 T15:EV-T15-012", "FDA adaptive DBS:EV-15"}

          current = payload["current_canonical_checkpoint"]
          assert current == {
              "effective_source_count": 248,
              "monitor_registry_source_count": 224,
              "unmonitored_effective_source_count": 24,
              "mutated_by_this_queue": False,
          }, current

          print("LEGACY SOURCE PROMOTION READINESS")
          print("rows: 35")
          print("static identity review: 22")
          print("live refresh required: 11")
          print("curation required: 2")
          print("approval: NOT_APPROVED; canonical: NOT_CANONICAL; human review: UNREVIEWED")
          PY
      - name: Build projection on governing corpus
        run: >-
          python scripts/build_analytical_projection.py
          --records-dir releases/data-v0.1.0-public-governing/records
          --output-dir "$RUNNER_TEMP/neuroai-analytics"
          --as-of 2026-08-08
      - name: Build monitoring eligibility on governing corpus
        run: >-
          python scripts/build_monitoring_eligibility.py
          --records-dir releases/data-v0.1.0-public-governing/records
          --output-dir "$RUNNER_TEMP/neuroai-monitoring"
      - name: Verify expected outputs
        run: |
          test -s "$RUNNER_TEMP/legacy-source-monitoring/legacy-source-prospective-monitoring.json"
          test -s "$RUNNER_TEMP/legacy-source-monitoring/legacy-source-prospective-monitoring.csv"
          test -s "$RUNNER_TEMP/legacy-source-monitoring/legacy-source-prospective-monitoring.md"
          test -s "$RUNNER_TEMP/legacy-source-promotion-readiness/legacy-source-promotion-readiness.json"
          test -s "$RUNNER_TEMP/legacy-source-promotion-readiness/legacy-source-promotion-readiness.csv"
          test -s "$RUNNER_TEMP/legacy-source-promotion-readiness/legacy-source-promotion-readiness.md"
          test -s "$RUNNER_TEMP/neuroai-analytics/organizations.jsonl"
          test -s "$RUNNER_TEMP/neuroai-analytics/sources.jsonl"
          test -s "$RUNNER_TEMP/neuroai-analytics/source_monitors.jsonl"
          test -s "$RUNNER_TEMP/neuroai-analytics/data-health.json"
          test -s "$RUNNER_TEMP/neuroai-analytics/current-state.json"
          test -s "$RUNNER_TEMP/neuroai-analytics/table-manifest.json"
          test -s "$RUNNER_TEMP/neuroai-monitoring/monitoring-eligibility.json"
          test -s "$RUNNER_TEMP/neuroai-monitoring/monitoring-eligibility.csv"
      - name: Verify real-corpus monitoring checkpoint
        env:
          MONITORING_ROOT: ${{ runner.temp }}/neuroai-monitoring
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["MONITORING_ROOT"])
          payload = json.loads((root / "monitoring-eligibility.json").read_text())
          metadata = payload["metadata"]
          rows = payload["sources"]

          assert metadata["effective_source_count"] == 248, metadata
          assert metadata["monitor_registry_source_count"] == 224, metadata
          assert metadata["unmonitored_effective_source_count"] == 24, metadata
          assert len(rows) == 248, len(rows)
          assert len({row["source_id"] for row in rows}) == 248
          assert sum(not row["monitor_present"] for row in rows) == 24
          assert set(payload["unmonitored_mode_counts"]).issubset({"RECURRING", "ON_CHANGE", "ARCHIVAL_STATIC"})

          print("MONITORING ELIGIBILITY")
          print(f"effective: {metadata['effective_source_count']}")
          print(f"existing monitors: {metadata['monitor_registry_source_count']}")
          print(f"unmonitored effective: {metadata['unmonitored_effective_source_count']}")
          for mode, count in payload["unmonitored_mode_counts"].items():
              print(f"{mode}: {count}")
          PY
      - name: Print data checkpoint
        env:
          ANALYTICS_ROOT: ${{ runner.temp }}/neuroai-analytics
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ANALYTICS_ROOT"])
          manifest = json.loads((root / "table-manifest.json").read_text())
          health = json.loads((root / "data-health.json").read_text())

          print("TABLE COUNTS")
          for table in manifest["tables"]:
              print(f"{table['table']}: {table['row_count']}")

          print("FRESHNESS")
          freshness = health["source_monitor_freshness"]
          for key, value in freshness["counts"].items():
              print(f"{key}: {value}")
          print(f"ATTENTION: {len(freshness['attention'])}")
          PY
