name: Analytical projection

on:
  pull_request:
    paths:
      - "scripts/build_analytical_projection.py"
      - "scripts/build_monitoring_eligibility.py"
      - "scripts/validate_legacy_source_registration.py"
      - "scripts/project_legacy_source_registration_impact.py"
      - "tests/test_build_analytical_projection.py"
      - "tests/test_build_monitoring_eligibility.py"
      - "tests/test_build_legacy_source_registration.py"
      - "tests/test_build_legacy_source_registration_provenance.py"
      - "tests/test_build_legacy_source_registration_impact.py"
      - "curation/legacy_assessment_source_registration_proposals_v0.1.json"
      - "curation/legacy_assessment_source_registration_provenance_v0.1.json"
      - "schemas/legacy-source-registration-proposals.schema.json"
      - ".github/workflows/analytical-projection.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build_analytical_projection.py"
      - "scripts/build_monitoring_eligibility.py"
      - "scripts/validate_legacy_source_registration.py"
      - "scripts/project_legacy_source_registration_impact.py"
      - "tests/test_build_analytical_projection.py"
      - "tests/test_build_monitoring_eligibility.py"
      - "tests/test_build_legacy_source_registration.py"
      - "tests/test_build_legacy_source_registration_provenance.py"
      - "tests/test_build_legacy_source_registration_impact.py"
      - "curation/legacy_assessment_source_registration_proposals_v0.1.json"
      - "curation/legacy_assessment_source_registration_provenance_v0.1.json"
      - "schemas/legacy-source-registration-proposals.schema.json"
      - ".github/workflows/analytical-projection.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_build_*.py' -v
      - name: Validate legacy source registration proposals
        run: python scripts/validate_legacy_source_registration.py
      - name: Verify legacy source registration checkpoint
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("curation/legacy_assessment_source_registration_proposals_v0.1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          metadata = payload["derived_from"]
          proposals = payload["proposals"]
          actions = Counter(row["action"] for row in proposals)

          assert metadata["source_universe_count"] == 248, metadata
          assert metadata["assessment_evidence_count"] == 52, metadata
          assert metadata["deterministic_matched_evidence_count"] == 15, metadata
          assert metadata["unresolved_evidence_count"] == 37, metadata
          assert metadata["registration_eligible_evidence_count"] == 35, metadata
          assert metadata["exact_identity_source_proposal_count"] == 33, metadata
          assert metadata["missing_explicit_source_count"] == 1, metadata
          assert metadata["curation_required_count"] == 1, metadata
          assert metadata["fuzzy_matching"] is False, metadata
          assert len(proposals) == 35, len(proposals)
          assert actions == {
              "REGISTER_NEW_SOURCE": 33,
              "REGISTER_MISSING_EXPLICIT_SOURCE": 1,
              "CURATION_REQUIRED": 1,
          }, actions
          assert sum(
              len(row["linked_evidence"])
              for row in proposals
              if row["action"] == "REGISTER_NEW_SOURCE"
          ) == 35
          assert sum(len(row["linked_evidence"]) for row in proposals) == 37

          print("LEGACY SOURCE REGISTRATION")
          print("source universe: 248")
          print("assessment evidence: 52")
          print("deterministically matched: 15")
          print("unresolved: 37")
          print("registration-eligible evidence: 35")
          print("exact source proposals: 33")
          print("missing explicit source: 1")
          print("curation-only: 1")
          PY
      - name: Project legacy source registration impact
        run: >-
          python scripts/project_legacy_source_registration_impact.py
          --output-dir "$RUNNER_TEMP/legacy-source-registration-impact"
      - name: Verify prospective identity-safe impact
        env:
          IMPACT_ROOT: ${{ runner.temp }}/legacy-source-registration-impact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["IMPACT_ROOT"])
          payload = json.loads((root / "legacy-source-registration-impact.json").read_text(encoding="utf-8"))
          scenario = payload["full_identity_safe_acceptance_scenario"]
          remaining = payload["remaining_unresolved_evidence"]
          packet = payload["review_packet"]

          assert payload["status"] == "NONCANONICAL_PROJECTION", payload["status"]
          assert payload["scenario_only"] is True
          assert scenario["newly_joinable_evidence_count"] == 36, scenario
          assert scenario["projected_deterministically_matched_evidence_count"] == 51, scenario
          assert scenario["projected_joinability"] == {"numerator": 51, "denominator": 52}, scenario
          assert scenario["projected_unresolved_evidence_count"] == 1, scenario
          assert scenario["projected_added_source_identity_count"] == 34, scenario
          assert scenario["projected_effective_source_count"] == 282, scenario
          assert scenario["canonical_status"] == "SCENARIO_ONLY_NOT_CURRENT_CANONICAL_DATA", scenario
          assert len(remaining) == 1, remaining
          assert remaining[0]["system"] == "FDA adaptive DBS", remaining
          assert remaining[0]["evidence_id"] == "EV-15", remaining
          assert {row["review_disposition"] for row in packet} <= {
              "READY_FOR_IDENTITY_REVIEW",
              "CURATION_REQUIRED",
          }
          assert all(
              row["monitoring_disposition"] == "UNCLASSIFIED_PENDING_SEPARATE_MONITORING_REVIEW"
              for row in packet
          )
          assert sorted(
              row["requested_source_id"]
              for row in packet
              if row["requested_source_id"]
          ) == ["SRC-PR-011"]

          print("LEGACY REGISTRATION IMPACT")
          print("current joinability: 15/52")
          print("newly joinable if identity-safe proposals are later accepted: 36")
          print("projected joinability: 51/52")
          print("remaining unresolved: FDA adaptive DBS EV-15")
          print("projected effective sources: 282 (scenario only)")
          PY
      - name: Build projection on governing corpus
        run: >-
          python scripts/build_analytical_projection.py
          --records-dir releases/data-v0.1.0-public-governing/records
          --output-dir "$RUNNER_TEMP/neuroai-analytics"
          --as-of 2026-08-08
      - name: Build monitoring eligibility on governing corpus
        run: >-
          python scripts/build_monitoring_eligibility.py
          --records-dir releases/data-v0.1.0-public-governing/records
          --output-dir "$RUNNER_TEMP/neuroai-monitoring"
      - name: Verify expected outputs
        run: |
          test -s "$RUNNER_TEMP/neuroai-analytics/organizations.jsonl"
          test -s "$RUNNER_TEMP/neuroai-analytics/sources.jsonl"
          test -s "$RUNNER_TEMP/neuroai-analytics/source_monitors.jsonl"
          test -s "$RUNNER_TEMP/neuroai-analytics/data-health.json"
          test -s "$RUNNER_TEMP/neuroai-analytics/current-state.json"
          test -s "$RUNNER_TEMP/neuroai-analytics/table-manifest.json"
          test -s "$RUNNER_TEMP/neuroai-monitoring/monitoring-eligibility.json"
          test -s "$RUNNER_TEMP/neuroai-monitoring/monitoring-eligibility.csv"
      - name: Verify real-corpus monitoring checkpoint
        env:
          MONITORING_ROOT: ${{ runner.temp }}/neuroai-monitoring
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["MONITORING_ROOT"])
          payload = json.loads((root / "monitoring-eligibility.json").read_text())
          metadata = payload["metadata"]
          rows = payload["sources"]

          assert metadata["effective_source_count"] == 248, metadata
          assert metadata["monitor_registry_source_count"] == 224, metadata
          assert metadata["unmonitored_effective_source_count"] == 24, metadata
          assert len(rows) == 248, len(rows)
          assert len({row["source_id"] for row in rows}) == 248
          assert sum(not row["monitor_present"] for row in rows) == 24
          assert set(payload["unmonitored_mode_counts"]).issubset({"RECURRING", "ON_CHANGE", "ARCHIVAL_STATIC"})

          print("MONITORING ELIGIBILITY")
          print(f"effective: {metadata['effective_source_count']}")
          print(f"existing monitors: {metadata['monitor_registry_source_count']}")
          print(f"unmonitored effective: {metadata['unmonitored_effective_source_count']}")
          for mode, count in payload["unmonitored_mode_counts"].items():
              print(f"{mode}: {count}")
          PY
      - name: Print data checkpoint
        env:
          ANALYTICS_ROOT: ${{ runner.temp }}/neuroai-analytics
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ANALYTICS_ROOT"])
          manifest = json.loads((root / "table-manifest.json").read_text())
          health = json.loads((root / "data-health.json").read_text())

          print("TABLE COUNTS")
          for table in manifest["tables"]:
              print(f"{table['table']}: {table['row_count']}")

          print("FRESHNESS")
          freshness = health["source_monitor_freshness"]
          for key, value in freshness["counts"].items():
              print(f"{key}: {value}")
          print(f"ATTENTION: {len(freshness['attention'])}")
          PY
