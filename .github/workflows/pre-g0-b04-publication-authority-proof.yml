name: PRE-G0 B04 publication authority proof

on:
  pull_request:
    paths:
      - "scripts/run_pre_g0_b04_publication_authority_proof.py"
      - "tests/test_pre_g0_b04_publication_authority_proof.py"
      - ".github/workflows/pre-g0-b04-publication-authority-proof.yml"
  push:
    branches: [main]
    paths:
      - "scripts/run_pre_g0_b04_publication_authority_proof.py"
      - "tests/test_pre_g0_b04_publication_authority_proof.py"
      - ".github/workflows/pre-g0-b04-publication-authority-proof.yml"

permissions:
  contents: read

jobs:
  prove-authority-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout S2 control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Checkout exact Workbench publication implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 685f1597a2a63f2e2217f65f115a67ac3e35cc55
          path: workbench
          persist-credentials: false

      - name: Install hash-locked exact Workbench runtime
        run: |
          python -m pip install --require-hashes -r workbench/requirements/constraints.txt
          python -m pip install --no-deps ./workbench

      - name: Verify B04 proof code
        run: |
          python -m compileall -q \
            scripts/run_pre_g0_b04_publication_authority_proof.py \
            tests/test_pre_g0_b04_publication_authority_proof.py
          python -m ruff format --check \
            scripts/run_pre_g0_b04_publication_authority_proof.py \
            tests/test_pre_g0_b04_publication_authority_proof.py
          python -m ruff check \
            scripts/run_pre_g0_b04_publication_authority_proof.py \
            tests/test_pre_g0_b04_publication_authority_proof.py
          python -m unittest tests/test_pre_g0_b04_publication_authority_proof.py -v

      - name: Prove ephemeral graph publication authority lifecycle
        run: |
          proof_root="$RUNNER_TEMP/pre-g0-b04"
          mkdir -p "$proof_root"
          python scripts/run_pre_g0_b04_publication_authority_proof.py \
            --workspace "$proof_root/workspace" \
            --output "$proof_root/proof.json" \
            --workbench-commit "685f1597a2a63f2e2217f65f115a67ac3e35cc55"
          test ! -e "$proof_root/workspace"

      - name: Enforce sanitized B04 acceptance boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "pre-g0-b04" / "proof.json").read_text(encoding="utf-8")
          )
          assert proof["status"] == "PRE_G0_B04_NONPRODUCTION_PUBLICATION_AUTHORITY_PROOF"
          assert proof["workbench_commit"] == "685f1597a2a63f2e2217f65f115a67ac3e35cc55"
          assert proof["candidate"]["synthetic_only"] is True
          assert proof["candidate"]["candidate_verification_valid"] is True
          assert proof["candidate"]["preview_canonical"] is False
          assert proof["candidate"]["preview_published"] is False
          assert proof["candidate"]["public_loader_refused_candidate_only"] is True
          assert proof["withhold"]["decision"] == "WITHHOLD"
          assert proof["withhold"]["publication_refused"] is True
          assert proof["authorize"]["decision"] == "AUTHORIZE"
          assert proof["authorize"]["supersedes_authorization_id"] == proof["withhold"]["authorization_id"]
          assert proof["authorize"]["authorization_store_valid"] is True
          assert proof["authorize"]["active_authorization_count"] == 1
          assert proof["authorize"]["public_loader_refused_before_publication"] is True
          assert proof["publication"]["publication_binding_valid"] is True
          assert proof["publication"]["automatic_publication_performed"] is False
          assert proof["publication"]["substantive_publication_performed"] is False
          assert proof["public_v1"]["loaded_only_after_publication_binding"] is True
          assert proof["public_v1"]["canonical"] is True
          assert proof["public_v1"]["published"] is True
          assert proof["public_v1"]["release_authorized"] is True
          assert proof["public_v1"]["health_status"] == "ok"
          assert proof["public_v1"]["read_only"] is True
          assert proof["public_v1"]["writes_supported"] is False
          assert proof["tamper"]["published_loader_refused_tampered_copy"] is True
          assert proof["controls"]["ephemeral_synthetic_state_only"] is True
          assert proof["controls"]["ephemeral_workspace_deleted"] is True
          assert proof["controls"]["repository_release_directory_modified"] is False
          assert proof["controls"]["substantive_s2_release_authorized"] is False
          assert proof["controls"]["substantive_s2_release_published"] is False
          assert proof["controls"]["network_used"] is False
          assert proof["controls"]["source_data_used"] is False
          print("PRE_G0_B04_ACCEPTANCE=" + json.dumps({
              "candidate_id": proof["candidate"]["candidate_id"],
              "withhold_authorization_id": proof["withhold"]["authorization_id"],
              "authorize_authorization_id": proof["authorize"]["authorization_id"],
              "publication_id": proof["publication"]["publication_id"],
              "tamper_refused": proof["tamper"]["published_loader_refused_tampered_copy"],
              "substantive_publication_performed": proof["publication"]["substantive_publication_performed"],
          }, sort_keys=True))
          PY

      - name: Retain sanitized B04 proof only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pre-g0-b04-publication-authority-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-g0-b04/proof.json
          retention-days: 90
          if-no-files-found: error

      - name: Delete ephemeral proof root and verify repository cleanliness
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/pre-g0-b04"
          rm -rf workbench
          test ! -e "$RUNNER_TEMP/pre-g0-b04"
          git status --porcelain
          test -z "$(git status --porcelain)"
