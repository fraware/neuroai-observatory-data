name: SU-GRANTS NIH RePORTER recorded replay

on:
  pull_request:
    paths:
      - 'curation/nih_reporter_grants_discovery_programme_v0.1.json'
      - 'schemas/nih-reporter-grants-discovery-replay-input.schema.json'
      - 'scripts/current_source_namespace.py'
      - 'scripts/run_su_grants_nih_reporter_recorded_replay.py'
      - 'tests/test_nih_reporter_grants_recorded_replay.py'
      - 'releases/data-v0.1.0-public-governing/records/canonical_observatory_release_v1.4.json'
      - 'releases/data-v0.1.0-public-governing/records/canonical_live_refresh_release_v1.6.json'
      - 'supplemental_records/PRIMA_NEW_UNIQUE_SOURCE_REGISTER_v1.7.json'
      - '.github/workflows/su-grants-nih-reporter-recorded-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Checkout exact merged Workbench RePORTER capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 29f3a93e7a9050684687cc11b0568b7a9c6ef867
          path: .workbench
          persist-credentials: false
      - name: Install exact Workbench tree
        run: python -m pip install --disable-pip-version-check -e .workbench
      - name: Verify exact RePORTER projector
        run: |
          python - <<'PY'
          from neuroai_workbench.discovery import project_nih_reporter_search_pages
          assert callable(project_nih_reporter_search_pages)
          PY
      - name: Run S2 programme and replay tests
        run: |
          python scripts/validate_nih_reporter_grants_discovery_programme.py
          python -m unittest tests.test_current_source_namespace
          python -m unittest tests.test_nih_reporter_grants_discovery_programme
          python -m unittest tests.test_nih_reporter_grants_recorded_replay
      - name: Run exact Workbench RePORTER tests
        run: python .workbench/tests/test_nih_reporter_discovery_projection.py
      - name: Exercise exact projector through current S2 replay
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import run_su_grants_nih_reporter_recorded_replay as replay
          p=replay._programme();s=p['query_streams'][0]
          payload={'criteria':{'advanced_text_search':s['advanced_text_search']},'offset':0,'limit':500}
          provider_page={'meta':{'total':1,'offset':0,'limit':500},'results':[{'appl_id':12345678,'project_num':'1R01NS123456-01','core_project_num':'R01NS123456','subproject_id':None,'fiscal_year':2026,'project_title':'Synthetic neural interface project','abstract_text':'Synthetic integration fixture','project_start_date':'2026-01-01','project_end_date':'2028-12-31','award_notice_date':'2026-01-15','award_amount':100000,'funding_mechanism':'RP','agency_ic_admin':{'code':'NS'},'organization':{'org_name':'Example University'},'principal_investigators':[{'full_name':'Example PI'}]}]}
          bundle={'schema_version':'0.1.0','programme_id':p['programme_id'],'capture_scope':'PARTIAL_VALIDATION','captured_at':'2026-09-02T00:00:00Z','provider':p['provider_contract']['provider'],'leaf_query_captures':[{'query_id':s['query_id'],'leaf_query_id':'integration-root','query_payload':payload,'partition_path':[],'pages':[provider_page]}]}
          result=replay.build_replay(bundle);r=result['reconciliation']
          assert r['materialized_source_namespace_count']==248
          assert len(r['controlled_source_id_set_sha256'])==64
          assert r['union_unique_appl_id_count']==1
          assert r['leaf_mechanical_blocker_count']==0
          assert r['mechanically_complete'] is False
          assert r['partition_reconciliation_required'] is False
          assert r['automatic_project_entity_creation'] is False
          assert r['automatic_pi_or_organization_entity_creation'] is False
          assert r['automatic_funding_success_claim_creation'] is False
          assert r['canonical_successor_ready'] is False
          PY
      - name: Verify no raw RePORTER capture is committed
        run: |
          if find . -path './.git' -prune -o -path './.workbench' -prune -o -type f \( -iname '*reporter*raw*.json' -o -iname '*reporter*page*.json' -o -iname '*reporter*response*.json' \) -print | grep -q .; then
            echo 'Raw NIH RePORTER pages must remain external/ephemeral.' >&2
            exit 1
          fi
