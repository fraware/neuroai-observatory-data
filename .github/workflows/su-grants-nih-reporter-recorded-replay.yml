name: SU-GRANTS NIH RePORTER recorded replay

on:
  pull_request:
    paths:
      - "curation/nih_reporter_grants_discovery_programme_v0.1.json"
      - "schemas/nih-reporter-grants-discovery-programme.schema.json"
      - "schemas/nih-reporter-grants-discovery-replay-input.schema.json"
      - "scripts/run_su_grants_nih_reporter_recorded_replay.py"
      - "scripts/validate_nih_reporter_grants_discovery_programme.py"
      - "tests/test_nih_reporter_grants_discovery_programme.py"
      - "tests/test_nih_reporter_grants_recorded_replay.py"
      - ".github/workflows/su-grants-nih-reporter-recorded-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout observatory data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout exact proposed Workbench NIH RePORTER capability
        uses: actions/checkout@v4
        with:
          repository: fraware/neuroai-workbench
          ref: ecd7541a9af2375aaa68025eef82894ca6b44bb1
          path: .workbench
          persist-credentials: false

      - name: Install exact Workbench tree
        run: python -m pip install --disable-pip-version-check -e .workbench

      - name: Verify exact Workbench RePORTER projector is available
        run: |
          python - <<'PY'
          from neuroai_workbench.discovery import project_nih_reporter_search_pages
          assert callable(project_nih_reporter_search_pages)
          PY

      - name: Validate S2 programme control
        run: python scripts/validate_nih_reporter_grants_discovery_programme.py

      - name: Run S2 grant programme and replay tests
        run: |
          python -m unittest tests/test_nih_reporter_grants_discovery_programme.py
          python -m unittest tests/test_nih_reporter_grants_recorded_replay.py

      - name: Run exact Workbench RePORTER projection tests
        run: python .workbench/tests/test_nih_reporter_discovery_projection.py

      - name: Exercise actual projector through S2 replay boundary
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import run_su_grants_nih_reporter_recorded_replay as replay

          programme = replay._programme()
          stream = programme["query_streams"][0]
          page = {
              "meta": {"total": 1, "offset": 0, "limit": 500},
              "results": [{
                  "appl_id": 987654321,
                  "project_num": "R01-INTEGRATION",
                  "core_project_num": "R01-INTEGRATION",
                  "fiscal_year": 2026,
                  "project_title": "Integration fixture neural interface project",
                  "abstract_text": "Synthetic fixture for deterministic integration testing.",
                  "award_amount": 1,
              }],
          }
          bundle = {
              "schema_version": "0.1.0",
              "programme_id": programme["programme_id"],
              "provider": programme["provider_contract"]["provider"],
              "capture_scope": "PARTIAL_VALIDATION",
              "captured_at": "2026-09-01T00:00:00Z",
              "leaf_query_captures": [{
                  "query_id": stream["query_id"],
                  "leaf_query_id": "integration-root",
                  "query_payload": {
                      "criteria": {"advanced_text_search": stream["advanced_text_search"]},
                      "offset": 0,
                      "limit": 500,
                  },
                  "partition_path": [],
                  "pages": [page],
              }],
          }
          result = replay.build_replay(bundle)
          assert result["reconciliation"]["materialized_source_namespace_count"] == 248
          assert result["reconciliation"]["union_unique_appl_id_count"] == 1
          assert result["reconciliation"]["leaf_mechanical_blocker_count"] == 0
          assert result["reconciliation"]["mechanically_complete"] is False
          assert result["reconciliation"]["automatic_pi_or_organization_entity_creation"] is False
          assert result["reconciliation"]["automatic_funding_success_claim_creation"] is False
          assert result["reconciliation"]["canonical_successor_ready"] is False
          PY

      - name: Verify no raw RePORTER capture is committed
        run: |
          if find . -path './.git' -prune -o -path './.workbench' -prune -o -type f \( -iname '*reporter*raw*.json' -o -iname '*reporter*page*.json' -o -iname '*reporter*response*.json' \) -print | grep -q .; then
            echo "Raw NIH RePORTER replay pages must remain external/ephemeral." >&2
            exit 1
          fi
