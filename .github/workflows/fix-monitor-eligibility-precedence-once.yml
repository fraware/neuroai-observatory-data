name: Fix monitoring eligibility precedence once

on:
  push:
    branches:
      - agent/current-monitor-accountability
    paths:
      - .github/workflows/fix-monitor-eligibility-precedence-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/current-monitor-accountability
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Make source class authoritative for static versus living eligibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_monitoring_eligibility.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _rule_for(source_class: Any, title: Any) -> tuple[str, str | None, str, str]:\n")
          end = text.index("\n\ndef classify_monitoring(", start)
          replacement = '''def _rule_for(source_class: Any, title: Any) -> tuple[str, str | None, str, str]:\n    source_token = _text(source_class)\n    title_token = _text(title)\n\n    # Source class is the primary operational ontology. Dated/versioned artifact\n    # classes must not become living monitors solely because their titles contain\n    # words such as "trial" or "product".\n    if "MANUAL" in source_token:\n        return (\n            "ARCHIVAL_STATIC",\n            None,\n            "LOW",\n            "Versioned or historical manual is treated as a fixed evidence artifact unless a successor is discovered.",\n        )\n    if any(\n        part in source_token\n        for part in (\n            "PEER_REVIEWED",\n            "PREPRINT",\n            "PUBLICATION",\n            "BIBLIOGRAPHIC",\n            "MEDIA",\n            "ANNOUNCEMENT",\n            "TRANSACTION",\n            "ACQUISITION",\n            "DSMB",\n        )\n    ):\n        return (\n            "ARCHIVAL_STATIC",\n            None,\n            "LOW",\n            "Publication or dated event record is expected to remain fixed; monitor the underlying programme separately.",\n        )\n    if "TRIAL_REGISTRY" in source_token or "CLINICALTRIAL" in source_token or "CLINICAL_TRIAL" in source_token:\n        return (\n            "RECURRING",\n            "MONTHLY",\n            "HIGH",\n            "Living trial-registry metadata can change during recruitment, follow-up, and results posting.",\n        )\n    if any(\n        part in source_token\n        for part in ("TECHNOLOGY_PAGE", "PRODUCT_PAGE", "OPERATIONAL_CAPACITY", "RECRUIT", "CAREER")\n    ):\n        return (\n            "RECURRING",\n            "MONTHLY",\n            "NORMAL",\n            "Living official product/technology/operational page is useful for current-state monitoring.",\n        )\n    if any(part in source_token for part in ("GUIDANCE", "LEGAL_TEXT", "REGULATION", "PROCEDURAL")):\n        return (\n            "ON_CHANGE",\n            "QUARTERLY",\n            "NORMAL",\n            "Normative or procedural source changes infrequently but may alter interpretation or obligations.",\n        )\n\n    # Title is retained for diagnostics/future policy refinement, but an unknown\n    # source class stays explicit ON_CHANGE instead of being upgraded by keywords.\n    del title_token\n    return (\n        "ON_CHANGE",\n        None,\n        "NORMAL",\n        "No recurring rule applies; revisit on material ecosystem change or source-specific need.",\n    )\n'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          current = Path("scripts/build_current_monitor_accountability.py")
          text = current.read_text(encoding="utf-8")
          text = text.replace(
              'expected = {"MONITORED": 224, "EXEMPT_WITH_RATIONALE": 14, "MANUAL_ONLY": 6, "GAP": 4}',
              'expected = {"MONITORED": 224, "EXEMPT_WITH_RATIONALE": 15, "MANUAL_ONLY": 6, "GAP": 3}',
              1,
          )
          text = text.replace(
              'if candidate["candidate_record_count"] != 4:\n        raise ValueError(f"Expected four recurring monitor candidates, got {candidate[\'candidate_record_count\']}")',
              'if candidate["candidate_record_count"] != 3:\n        raise ValueError(f"Expected three recurring monitor candidates, got {candidate[\'candidate_record_count\']}")',
              1,
          )
          current.write_text(text, encoding="utf-8")

          tests = Path("tests/test_current_monitor_accountability.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              '{"MONITORED": 224, "EXEMPT_WITH_RATIONALE": 14, "MANUAL_ONLY": 6, "GAP": 4}',
              '{"MONITORED": 224, "EXEMPT_WITH_RATIONALE": 15, "MANUAL_ONLY": 6, "GAP": 3}',
              1,
          )
          text = text.replace('self.assertEqual(candidate["candidate_record_count"], 4)', 'self.assertEqual(candidate["candidate_record_count"], 3)', 1)
          text = text.replace('self.assertEqual(len({record["source_id"] for record in candidate["candidate_records"]}), 4)', 'self.assertEqual(len({record["source_id"] for record in candidate["candidate_records"]}), 3)', 1)
          text = text.replace('self.assertEqual(len(archival), 14)', 'self.assertEqual(len(archival), 15)', 1)
          text = text.replace('self.assertEqual(len(gaps), 4)', 'self.assertEqual(len(gaps), 3)', 1)
          marker = '    def test_candidate_reaches_zero_gap_without_rewriting_predecessor(self) -> None:\n'
          extra = '''    def test_dsmb_announcement_remains_archival_even_when_title_mentions_trial(self) -> None:\n        rows = {row["source_id"]: row for row in self.projection["current"]["sources"]}\n        self.assertEqual(rows["SRC-PR-010"]["accountability_state"], "EXEMPT_WITH_RATIONALE")\n        self.assertEqual(rows["SRC-PR-010"]["recommended_mode"], "ARCHIVAL_STATIC")\n        candidate_ids = {\n            record["source_id"] for record in self.projection["monitor_extension_candidate"]["candidate_records"]\n        }\n        self.assertNotIn("SRC-PR-010", candidate_ids)\n\n'''
          if marker not in text:
              raise SystemExit("candidate test marker not found")
          tests.write_text(text.replace(marker, extra + marker, 1), encoding="utf-8")
          PY
          python -m unittest tests/test_current_monitor_accountability.py -v
          rm -rf "$RUNNER_TEMP/accountability"
          python scripts/build_current_monitor_accountability.py --output-dir "$RUNNER_TEMP/accountability"
      - name: Commit semantic correction and remove one-shot workflow
        run: |
          git rm .github/workflows/fix-monitor-eligibility-precedence-once.yml
          git add scripts/build_monitoring_eligibility.py scripts/build_current_monitor_accountability.py tests/test_current_monitor_accountability.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep dated source classes archival in monitoring eligibility"
          git push origin HEAD:agent/current-monitor-accountability
