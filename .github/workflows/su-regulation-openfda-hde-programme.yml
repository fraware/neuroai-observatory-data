name: SU-REGULATION openFDA HDE programme
on:
  pull_request:
    paths:
      - 'curation/openfda_hde_discovery_programme_v0.1.json'
      - 'schemas/openfda-hde-discovery-programme.schema.json'
      - 'scripts/validate_openfda_hde_discovery_programme.py'
      - 'tests/test_openfda_hde_discovery_programme.py'
      - 'curation/source_universe_registry_v0.1.json'
      - '.github/workflows/su-regulation-openfda-hde-programme.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-programme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m json.tool curation/openfda_hde_discovery_programme_v0.1.json >/dev/null
      - run: python -m json.tool schemas/openfda-hde-discovery-programme.schema.json >/dev/null
      - run: python scripts/validate_openfda_hde_discovery_programme.py
      - run: python -m unittest tests.test_openfda_hde_discovery_programme
      - name: Assert HDE approval/effectiveness/IRB separation
        run: |
          python - <<'PY'
          import json
          p=json.load(open('curation/openfda_hde_discovery_programme_v0.1.json'))
          assert p['workbench_dependency']['integration_state']=='AVAILABLE'
          assert p['decision_semantics_policy']['exact_code_map']['APPR']=='HDE_APPROVAL_RECORDED'
          assert p['hde_authority_policy']['hde_approval_does_not_establish_reasonable_assurance_of_effectiveness'] is True
          assert p['hde_authority_policy']['hde_approval_does_not_establish_facility_irb_approval'] is True
          assert p['candidate_projection']['effectiveness_claim_created_from_hde_approval'] is False
          assert p['candidate_projection']['facility_irb_claim_created_from_hde_record'] is False
          assert p['inclusion_policy']['automatic_reopening_decision'] is False
          PY
