name: vNext science graph contract

on:
  pull_request:
    paths:
      - "science/**"
      - "infra/aws-phase4-custody/**"
      - "identity/namespaces-v0.1.json"
      - "schemas/vnext/source-adapter.schema.json"
      - "schemas/vnext/acquisition-freeze.schema.json"
      - "schemas/vnext/science-candidate-record.schema.json"
      - "schemas/vnext/identifier-namespace.schema.json"
      - "fixtures/vnext/science-acquisition.synthetic.json"
      - "scripts/validate_science_graph.py"
      - "scripts/compile_science_queries.py"
      - "scripts/acquire_science_candidates.py"
      - "scripts/acquire_science_candidates_strict.py"
      - "scripts/science_http_transport.py"
      - "scripts/run_science_acquisition.py"
      - "scripts/verify_science_acquisition.py"
      - "scripts/verify_science_candidate_provenance.py"
      - "scripts/verify_science_retry_custody.py"
      - "scripts/preflight_science_custody.py"
      - "tests/test_science_graph_contract.py"
      - "tests/test_science_query_compilation.py"
      - "tests/test_science_acquisition.py"
      - "tests/test_science_response_custody.py"
      - "tests/test_science_acquisition_verification.py"
      - "tests/test_science_candidate_provenance.py"
      - "tests/test_science_retry_custody.py"
      - "tests/test_science_http_transport.py"
      - "tests/test_run_science_acquisition.py"
      - "tests/test_science_custody_preflight.py"
      - "source-universes/p0/science-v0.1.json"
      - ".github/workflows/vnext-science-graph.yml"
  push:
    branches: [main]
    paths:
      - "science/**"
      - "infra/aws-phase4-custody/**"
      - "identity/namespaces-v0.1.json"
      - "schemas/vnext/source-adapter.schema.json"
      - "schemas/vnext/acquisition-freeze.schema.json"
      - "schemas/vnext/science-candidate-record.schema.json"
      - "schemas/vnext/identifier-namespace.schema.json"
      - "fixtures/vnext/science-acquisition.synthetic.json"
      - "scripts/validate_science_graph.py"
      - "scripts/compile_science_queries.py"
      - "scripts/acquire_science_candidates.py"
      - "scripts/acquire_science_candidates_strict.py"
      - "scripts/science_http_transport.py"
      - "scripts/run_science_acquisition.py"
      - "scripts/verify_science_acquisition.py"
      - "scripts/verify_science_candidate_provenance.py"
      - "scripts/verify_science_retry_custody.py"
      - "scripts/preflight_science_custody.py"
      - "tests/test_science_graph_contract.py"
      - "tests/test_science_query_compilation.py"
      - "tests/test_science_acquisition.py"
      - "tests/test_science_response_custody.py"
      - "tests/test_science_acquisition_verification.py"
      - "tests/test_science_candidate_provenance.py"
      - "tests/test_science_retry_custody.py"
      - "tests/test_science_http_transport.py"
      - "tests/test_run_science_acquisition.py"
      - "tests/test_science_custody_preflight.py"
      - "source-universes/p0/science-v0.1.json"
      - ".github/workflows/vnext-science-graph.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema[format]==4.26.0"
      - name: Validate science graph contract
        run: python scripts/validate_science_graph.py
      - name: Compile frozen provider query plan
        run: python scripts/compile_science_queries.py --output "$RUNNER_TEMP/science-query-plan.json"
      - name: Contract, compiler, acquisition, custody, gated-runner, transport, retry-custody, provenance, and storage-preflight tests
        run: >-
          python -m unittest
          tests/test_science_graph_contract.py
          tests/test_science_query_compilation.py
          tests/test_science_acquisition.py
          tests/test_science_response_custody.py
          tests/test_science_acquisition_verification.py
          tests/test_science_candidate_provenance.py
          tests/test_science_retry_custody.py
          tests/test_science_http_transport.py
          tests/test_run_science_acquisition.py
          tests/test_science_custody_preflight.py
          -v

  terraform_custody_reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/aws-phase4-custody
      - name: Initialize Terraform provider dependencies without a backend
        run: terraform -chdir=infra/aws-phase4-custody init -backend=false -input=false
      - name: Validate Terraform custody reference
        run: terraform -chdir=infra/aws-phase4-custody validate

# Deliberately no live provider acquisition in CI. Live Crossref/Europe PMC runs
# require explicit execution, durable raw-byte custody, and separate rights review.
