name: SU-PUBLICATIONS Europe PMC programme

on:
  pull_request:
    paths:
      - "curation/europepmc_publications_discovery_programme_v0.1.json"
      - "curation/source_universe_registry_v0.1.json"
      - "schemas/europepmc-publications-discovery-programme.schema.json"
      - "scripts/validate_europepmc_publications_discovery_programme.py"
      - "tests/test_europepmc_publications_discovery_programme.py"
      - ".github/workflows/su-publications-europepmc-programme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-programme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Parse programme and schema controls
        run: |
          python -m json.tool curation/europepmc_publications_discovery_programme_v0.1.json >/dev/null
          python -m json.tool schemas/europepmc-publications-discovery-programme.schema.json >/dev/null
      - name: Validate bounded Europe PMC programme
        run: python scripts/validate_europepmc_publications_discovery_programme.py
      - name: Run programme tests
        run: python -m unittest tests/test_europepmc_publications_discovery_programme.py -v
      - name: Enforce no live-execution claim in programme-definition layer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("curation/europepmc_publications_discovery_programme_v0.1.json")
          programme = json.loads(path.read_text(encoding="utf-8"))
          provider = programme["provider_contract"]
          network = programme["network_policy"]
          dependency = programme["workbench_dependency"]

          assert provider["configuration_performs_http"] is False
          assert network["configuration_performs_http"] is False
          assert network["live_execution"] == "OPT_IN_ONLY"
          assert network["hosted_success_claim_allowed_without_runner_steps"] is False
          assert dependency["integration_state"] == "NOT_IMPLEMENTED"
          assert programme["inclusion_policy"]["automatic_publication_source_admission"] is False
          assert programme["inclusion_policy"]["automatic_assessment_mutation"] is False
          assert programme["coverage_contract"]["global_neuroai_publication_recall_claim"] is False
          print("PROGRAMME_DEFINITION_ONLY=true")
          PY
