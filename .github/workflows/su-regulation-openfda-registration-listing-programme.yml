name: SU-REGULATION openFDA registration-listing programme

on:
  pull_request:
    paths:
      - 'curation/openfda_registration_listing_discovery_programme_v0.1.json'
      - 'schemas/openfda-registration-listing-discovery-programme.schema.json'
      - 'scripts/validate_openfda_registration_listing_discovery_programme.py'
      - 'tests/test_openfda_registration_listing_discovery_programme.py'
      - 'curation/source_universe_registry_v0.1.json'
      - '.github/workflows/su-regulation-openfda-registration-listing-programme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Parse programme and schema
        run: |
          python - <<'PY'
          import json
          for path in ['curation/openfda_registration_listing_discovery_programme_v0.1.json','schemas/openfda-registration-listing-discovery-programme.schema.json']:
              json.load(open(path,encoding='utf-8'))
          PY
      - name: Run deterministic validator
        run: python scripts/validate_openfda_registration_listing_discovery_programme.py
      - name: Run focused tests
        run: python -m unittest tests.test_openfda_registration_listing_discovery_programme
