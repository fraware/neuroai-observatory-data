name: SU-REGULATION openFDA PMA programme
on:
  pull_request:
    paths:
      - 'curation/openfda_pma_discovery_programme_v0.1.json'
      - 'schemas/openfda-pma-discovery-programme.schema.json'
      - 'scripts/validate_openfda_pma_discovery_programme.py'
      - 'tests/test_openfda_pma_discovery_programme.py'
      - 'curation/source_universe_registry_v0.1.json'
      - '.github/workflows/su-regulation-openfda-pma-programme.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-programme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m json.tool curation/openfda_pma_discovery_programme_v0.1.json >/dev/null
      - run: python -m json.tool schemas/openfda-pma-discovery-programme.schema.json >/dev/null
      - run: python scripts/validate_openfda_pma_discovery_programme.py
      - run: python -m unittest tests.test_openfda_pma_discovery_programme
      - name: Assert PMA original/supplement authority boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('curation/openfda_pma_discovery_programme_v0.1.json'))
          assert p['workbench_dependency']['integration_state']=='AVAILABLE'
          assert p['identity_policy']['record_identity']=='PMA_NUMBER_PLUS_SUPPLEMENT_NUMBER'
          assert p['decision_semantics_policy']['exact_code_map']['APPR']=='APPROVAL_RECORDED'
          assert p['decision_semantics_policy']['supplement_approval_does_not_rewrite_original_application_record'] is True
          assert p['candidate_projection']['hde_records_emitted_as_pma_candidates'] is False
          assert p['candidate_projection']['legacy_nda_records_emitted_as_pma_candidates'] is False
          assert p['coverage_contract']['record_presence_is_approval_claim'] is False
          assert p['inclusion_policy']['automatic_reopening_decision'] is False
          PY
