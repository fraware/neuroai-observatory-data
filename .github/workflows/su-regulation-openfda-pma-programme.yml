name: SU-REGULATION openFDA PMA programme
on:
  pull_request:
    paths:
      - "curation/openfda_pma_discovery_programme_v0.1.json"
      - "schemas/openfda-pma-discovery-programme.schema.json"
      - "scripts/validate_openfda_pma_discovery_programme.py"
      - "tests/test_openfda_pma_discovery_programme.py"
      - ".github/workflows/su-regulation-openfda-pma-programme.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_openfda_pma_discovery_programme.py
      - run: python -m unittest tests/test_openfda_pma_discovery_programme.py
      - name: Refuse raw PMA captures
        run: |
          if find . -path './.git' -prune -o -type f \( -iname '*pma*raw*.json' -o -iname '*pma*response*.json' -o -iname '*pma*page*.json' \) -print | grep -q .; then
            echo "Raw openFDA PMA captures must remain external/ephemeral." >&2
            exit 1
          fi
