name: Format lifecycle test once

on:
  push:
    branches:
      - agent/31-lifecycle-successor-discovery
    paths:
      - ".github/workflows/format-lifecycle-test-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/31-lifecycle-successor-discovery
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Checkout exact workbench runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 428b4e8d797c0729bc4f36678daec88711688689
          path: workbench
      - name: Install pinned runtime
        run: |
          python -m pip install --require-hashes -r workbench/requirements/constraints.txt
          python -m pip install --no-deps ./workbench
      - name: Normalize shared lifecycle test
        run: |
          python -m ruff format tests/test_source_lifecycle_overlay.py
          python -m ruff check --fix --exit-zero tests/test_source_lifecycle_overlay.py
          python -m ruff format tests/test_source_lifecycle_overlay.py
          python -m ruff check tests/test_source_lifecycle_overlay.py
      - name: Commit if changed
        run: |
          rm -rf workbench
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_source_lifecycle_overlay.py
          git commit -m "Normalize lifecycle transition boundary test"
          git push origin HEAD:agent/31-lifecycle-successor-discovery
