name: Probe ClinicalTrials runner families once

on:
  push:
    branches:
      - agent/source-route-resilience
    paths:
      - "scripts/probe_ctgov_runner_family.py"
      - ".github/workflows/ctgov-runner-family-once.yml"

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Probe exact official routes with collector identity
        run: python scripts/probe_ctgov_runner_family.py
