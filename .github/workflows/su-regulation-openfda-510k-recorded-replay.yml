name: SU-REGULATION openFDA 510k recorded replay
on:
  pull_request:
    paths:
      - "curation/openfda_510k_discovery_programme_v0.1.json"
      - "schemas/openfda-510k-discovery-programme.schema.json"
      - "schemas/openfda-510k-discovery-replay-input.schema.json"
      - "scripts/run_su_regulation_openfda_510k_recorded_replay.py"
      - "tests/test_openfda_510k_discovery_programme.py"
      - "tests/test_openfda_510k_recorded_replay.py"
      - ".github/workflows/su-regulation-openfda-510k-recorded-replay.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout exact proposed Workbench 510k projector
        uses: actions/checkout@v4
        with:
          repository: fraware/neuroai-workbench
          ref: 4889dc34ba1b528d18c8d99130f0b2763d1c8005
          path: .workbench
          persist-credentials: false
      - name: Install exact Workbench tree
        run: python -m pip install --disable-pip-version-check -e .workbench
      - name: Validate programme and replay contracts
        run: |
          python scripts/validate_openfda_510k_discovery_programme.py
          python -m unittest tests/test_openfda_510k_discovery_programme.py
          python -m unittest tests/test_openfda_510k_recorded_replay.py
      - name: Run exact Workbench 510k projection tests
        run: python .workbench/tests/test_openfda_510k_discovery_projection.py
      - name: Exercise exact projector through replay boundary
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          import run_su_regulation_openfda_510k_recorded_replay as replay
          p=replay._programme();q=p["query_streams"][0]
          rows=[
            {"k_number":"K123456","device_name":"Synthetic neural interface","decision_code":"SESE","decision_description":"Substantially Equivalent","applicant":"Fixture Applicant","address_1":"must disappear"},
            {"k_number":"DEN250013","device_name":"Synthetic De Novo out-of-scope","decision_code":"SESE"}
          ]
          bundle={"schema_version":"0.1.0","programme_id":p["programme_id"],"provider":p["provider_contract"]["provider"],"capture_scope":"PARTIAL_VALIDATION","captured_at":"2026-09-01T00:00:00Z","leaf_query_captures":[{"query_id":q["query_id"],"leaf_query_id":"integration-root","effective_search":q["search"],"partition_path":[],"pages":[{"meta":{"results":{"total":2,"skip":0,"limit":1000}},"results":rows}]}]}
          result=replay.build_replay(bundle)
          assert result["reconciliation"]["materialized_source_namespace_count"]==248
          assert result["reconciliation"]["union_unique_k_number_count"]==1
          assert result["reconciliation"]["out_of_scope_den_count"]==1
          assert result["normalized_records"][0]["decision_semantics"]=="SUBSTANTIALLY_EQUIVALENT_RECORDED"
          assert "address_1" not in result["normalized_records"][0]
          assert result["reconciliation"]["canonical_successor_ready"] is False
          PY
      - name: Refuse committed raw 510k captures
        run: |
          if find . -path './.git' -prune -o -path './.workbench' -prune -o -type f \( -iname '*510k*raw*.json' -o -iname '*510k*response*.json' -o -iname '*510k*page*.json' \) -print | grep -q .; then
            echo "Raw openFDA 510(k) pages must remain external/ephemeral." >&2
            exit 1
          fi
