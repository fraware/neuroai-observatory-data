name: SU-REGULATION openFDA 510(k) recorded replay
on:
  pull_request:
    paths:
      - 'curation/openfda_510k_discovery_programme_v0.1.json'
      - 'schemas/openfda-510k-discovery-programme.schema.json'
      - 'schemas/openfda-510k-discovery-replay-input.schema.json'
      - 'scripts/current_source_namespace.py'
      - 'scripts/run_su_regulation_openfda_510k_recorded_replay.py'
      - 'scripts/validate_openfda_510k_discovery_programme.py'
      - 'tests/test_openfda_510k_discovery_programme.py'
      - 'tests/test_openfda_510k_recorded_replay.py'
      - '.github/workflows/su-regulation-openfda-510k-recorded-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Checkout exact merged Workbench provider integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 29f3a93e7a9050684687cc11b0568b7a9c6ef867
          path: .workbench
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -e .workbench
      - run: python -m json.tool schemas/openfda-510k-discovery-replay-input.schema.json >/dev/null
      - run: python scripts/validate_openfda_510k_discovery_programme.py
      - run: python -m unittest tests.test_openfda_510k_discovery_programme tests.test_openfda_510k_recorded_replay
      - name: Run exact Workbench 510(k) projector tests
        run: python .workbench/tests/test_openfda_510k_discovery_projection.py
      - name: Exercise exact decision and pathway semantics through current S2 replay
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import run_su_regulation_openfda_510k_recorded_replay as replay
          p=replay._programme();s=p['query_streams'][0]
          page={'meta':{'results':{'total':3,'skip':0,'limit':1000}},'results':[
            {'k_number':'K123456','device_name':'neural interface','decision_code':'SEKD','decision_description':'Substantially Equivalent','openfda':{'manufacturer_name':['MUST-NOT-PROJECT']}},
            {'k_number':'K123457','device_name':'neural interface','decision_code':'XX','decision_description':'Free text must not imply SE'},
            {'k_number':'DEN123456','device_name':'de novo neural device','decision_code':'SEKD'}
          ]}
          bundle={'schema_version':'0.1.0','programme_id':p['programme_id'],'provider':p['provider_contract']['provider'],'capture_scope':'PARTIAL_VALIDATION','captured_at':'2026-09-02T00:00:00Z','leaf_query_captures':[{'query_id':s['query_id'],'leaf_query_id':'integration-root','effective_search':s['search'],'partition_path':[],'pages':[page]}]}
          result=replay.build_replay(bundle);records={x['k_number']:x for x in result['normalized_510k_records']};q=result['reconciliation']
          assert set(records)=={'K123456','K123457'}
          assert records['K123456']['decision_semantics']=='SUBSTANTIALLY_EQUIVALENT_RECORDED'
          assert records['K123456']['decision_supports_substantial_equivalence'] is True
          assert records['K123456']['decision_code_recognized'] is True
          assert records['K123457']['decision_semantics']=='UNRESOLVED_DECISION_CODE'
          assert records['K123457']['decision_supports_substantial_equivalence'] is False
          assert records['K123457']['decision_code_recognized'] is False
          assert 'openfda' not in records['K123456']
          assert q['out_of_scope_den_count']==1
          assert q['record_presence_is_clearance_claim'] is False
          assert q['automatic_global_authorization_claim_creation'] is False
          assert q['canonical_successor_ready'] is False
          PY
      - name: Verify no raw 510(k) capture is committed
        run: |
          if find . -path './.git' -prune -o -path './.workbench' -prune -o -type f \( -iname '*510k*raw*.json' -o -iname '*510k*response*.json' -o -iname '*510k*page*.json' \) -print | grep -q .; then
            echo 'Raw openFDA 510(k) pages must remain external/ephemeral.' >&2
            exit 1
          fi
