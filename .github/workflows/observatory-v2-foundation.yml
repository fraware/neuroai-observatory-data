name: Observatory v2 foundation

on:
  pull_request:
    paths:
      - "README.md"
      - "curation/source_universe_registry_v0.1.json"
      - "docs/v1-to-v2-migration-spec.md"
      - "fixtures/v2-foundation/**"
      - "schemas/observatory-v1-observation.schema.json"
      - "schemas/observatory-v2-assertion.schema.json"
      - "schemas/observatory-v2-source.schema.json"
      - "schemas/observatory-v2-entity.schema.json"
      - "schemas/source-universe-registry.schema.json"
      - "scripts/build_v2_migration_accounting.py"
      - "scripts/project_v14_sources_to_v2.py"
      - "scripts/project_v14_organizations_to_v2.py"
      - "scripts/project_v14_models_to_v2.py"
      - "scripts/project_v14_model_dataset_registry_to_v2.py"
      - "scripts/verify_v2_foundation.py"
      - "tests/test_observatory_v2_foundation.py"
      - "tests/test_v14_source_v2_projection.py"
      - "tests/test_v14_organization_v2_projection.py"
      - "tests/test_v14_model_v2_projection.py"
      - "tests/test_v14_model_dataset_registry_v2_projection.py"
      - "tests/test_v2_migration_accounting.py"
      - ".github/workflows/observatory-v2-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify current governing release manifest
        run: >-
          python scripts/verify_manifest.py
          releases/data-v0.1.0-public-governing/records
          releases/data-v0.1.0-public-governing/SHA256SUMS.txt

      - name: Verify v2 foundation cross-record invariants
        run: python scripts/verify_v2_foundation.py

      - name: Run v2 foundation and migration-slice unit tests
        run: >-
          python -m unittest
          tests.test_observatory_v2_foundation
          tests.test_v14_source_v2_projection
          tests.test_v14_organization_v2_projection
          tests.test_v14_model_v2_projection
          tests.test_v14_model_dataset_registry_v2_projection
          tests.test_v2_migration_accounting

      - name: Build noncanonical migration accounting
        run: >-
          python scripts/build_v2_migration_accounting.py
          --output /tmp/v2-migration-accounting.json

      - name: Assert migration accounting remains noncanonical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/v2-migration-accounting.json').read_text())
          assert result['input_file_count'] == 6
          assert result['silent_unmapped_section_count'] == 0
          assert result['semantic_reconciliation_state'] == 'NOT_EXECUTED'
          assert result['invented_value_count'] is None
          assert result['claim_boundary_loss_count'] is None
          assert result['source_reference_loss_count'] is None
          assert result['canonical_successor_ready'] is False
          PY

      - name: Reconcile v1.4 source vertical slice
        run: |
          python scripts/project_v14_sources_to_v2.py --output-dir /tmp/v2-sources > /tmp/v2-sources-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/v2-sources/reconciliation.json').read_text())
          assert result['input_source_count'] == 224
          assert result['projected_source_count'] == 224
          assert result['normalized_core_mismatch_count'] == 0
          assert result['predecessor_payload_roundtrip_failure_count'] == 0
          assert result['claim_boundary_loss_count'] == 0
          assert result['source_reference_loss_count'] == 0
          assert result['temporal_precision_fabrication_count'] == 0
          assert result['invented_predecessor_field_value_count'] == 0
          assert result['canonical_successor_ready'] is False
          PY

      - name: Reconcile v1.4 organization/entity vertical slice
        run: |
          python scripts/project_v14_organizations_to_v2.py --output-dir /tmp/v2-organizations > /tmp/v2-organizations-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/v2-organizations/reconciliation.json').read_text())
          assert result['input_entry_count'] == 223
          assert result['projected_entity_count'] == 223
          assert result['organization_entity_count'] == 217
          assert result['provenance_node_count'] == 6
          assert result['projected_assertion_count'] == 2925
          assert result['source_linked_entry_count'] == 154
          assert result['predecessor_source_linkage_unresolved_entry_count'] == 69
          assert result['legacy_only_entry_count'] == 63
          for key in (
              'identity_mismatch_count',
              'entity_kind_mismatch_count',
              'predecessor_payload_roundtrip_failure_count',
              'predecessor_field_loss_count',
              'claim_boundary_loss_count',
              'source_reference_loss_count',
              'dangling_source_reference_count',
              'source_linkage_fabrication_count',
              'temporal_precision_fabrication_count',
              'invented_predecessor_field_value_count',
          ):
              assert result[key] == 0, (key, result[key])
          assert result['canonical_successor_ready'] is False
          PY

      - name: Reconcile v1.4 representative-model vertical slice
        run: |
          python scripts/project_v14_models_to_v2.py --output-dir /tmp/v2-models > /tmp/v2-models-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/v2-models/reconciliation.json').read_text())
          assert result['input_model_count'] == 13
          assert result['projected_model_entity_count'] == 13
          assert result['projected_assertion_count'] == 151
          assert result['source_linked_model_count'] == 13
          assert result['exact_knowledge_time_count'] == 10
          assert result['unresolved_knowledge_time_count'] == 3
          assert result['source_system_reference_count'] == 9
          for key in (
              'identity_mismatch_count',
              'predecessor_payload_roundtrip_failure_count',
              'predecessor_field_loss_count',
              'claim_boundary_loss_count',
              'source_reference_loss_count',
              'dangling_source_reference_count',
              'source_system_reference_loss_count',
              'temporal_precision_fabrication_count',
              'invented_predecessor_field_value_count',
          ):
              assert result[key] == 0, (key, result[key])
          assert result['canonical_successor_ready'] is False
          PY

      - name: Reconcile v1.4 model/dataset registry aggregate slice
        run: |
          python scripts/project_v14_model_dataset_registry_to_v2.py --output-dir /tmp/v2-registries > /tmp/v2-registries-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/v2-registries/reconciliation.json').read_text())
          assert result['input_registry_count'] == 5
          assert result['projected_registry_entity_count'] == 5
          assert result['projected_assertion_count'] == 25
          assert result['source_linked_registry_count'] == 5
          assert result['unresolved_knowledge_time_count'] == 5
          assert result['source_reported_record_count_total'] == 1716
          assert result['source_reported_subcount_value_total'] == 385872.0
          assert result['expanded_child_entity_count'] == 0
          for key in (
              'identity_mismatch_count',
              'predecessor_payload_roundtrip_failure_count',
              'predecessor_field_loss_count',
              'claim_boundary_loss_count',
              'source_reference_loss_count',
              'dangling_source_reference_count',
              'temporal_precision_fabrication_count',
              'invented_predecessor_field_value_count',
          ):
              assert result[key] == 0, (key, result[key])
          assert result['canonical_successor_ready'] is False
          PY
