name: Diagnose issue 31 targeted lint once

on:
  push:
    branches:
      - agent/31-lifecycle-successor-discovery
    paths:
      - ".github/workflows/diagnose-31-targeted-lint-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Checkout exact merged workbench lifecycle stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 428b4e8d797c0729bc4f36678daec88711688689
          path: workbench
      - name: Install hash-locked exact workbench runtime
        run: |
          python -m pip install --require-hashes -r workbench/requirements/constraints.txt
          python -m pip install --no-deps ./workbench
      - { name: "lint build_current_monitor_accountability", continue-on-error: true, run: "python -m ruff check scripts/build_current_monitor_accountability.py" }
      - { name: "lint build_development_monitor_registry", continue-on-error: true, run: "python -m ruff check scripts/build_development_monitor_registry.py" }
      - { name: "lint build_monitoring_eligibility", continue-on-error: true, run: "python -m ruff check scripts/build_monitoring_eligibility.py" }
      - { name: "lint evaluate_operational_health", continue-on-error: true, run: "python -m ruff check scripts/evaluate_operational_health.py" }
      - { name: "lint run_operational_due_cycle", continue-on-error: true, run: "python -m ruff check scripts/run_operational_due_cycle.py" }
      - { name: "lint run_successor_discovery", continue-on-error: true, run: "python -m ruff check scripts/run_successor_discovery.py" }
      - { name: "lint source_lifecycle_overlay", continue-on-error: true, run: "python -m ruff check scripts/source_lifecycle_overlay.py" }
      - { name: "lint test_current_monitor_accountability", continue-on-error: true, run: "python -m ruff check tests/test_current_monitor_accountability.py" }
      - { name: "lint test_development_monitor_registry", continue-on-error: true, run: "python -m ruff check tests/test_development_monitor_registry.py" }
      - { name: "lint test_monitoring_transition_manifest", continue-on-error: true, run: "python -m ruff check tests/test_monitoring_transition_manifest.py" }
      - { name: "lint test_operational_health", continue-on-error: true, run: "python -m ruff check tests/test_operational_health.py" }
      - { name: "lint test_operational_health_route_resilience", continue-on-error: true, run: "python -m ruff check tests/test_operational_health_route_resilience.py" }
      - { name: "lint test_source_lifecycle_overlay", continue-on-error: true, run: "python -m ruff check tests/test_source_lifecycle_overlay.py" }
      - { name: "lint test_successor_discovery", continue-on-error: true, run: "python -m ruff check tests/test_successor_discovery.py" }
      - name: Verify all targeted files together
        run: |
          python -m ruff format --check \
            scripts/build_current_monitor_accountability.py \
            scripts/build_development_monitor_registry.py \
            scripts/build_monitoring_eligibility.py \
            scripts/evaluate_operational_health.py \
            scripts/run_operational_due_cycle.py \
            scripts/run_successor_discovery.py \
            scripts/source_lifecycle_overlay.py \
            tests/test_current_monitor_accountability.py \
            tests/test_development_monitor_registry.py \
            tests/test_monitoring_transition_manifest.py \
            tests/test_operational_health.py \
            tests/test_operational_health_route_resilience.py \
            tests/test_source_lifecycle_overlay.py \
            tests/test_successor_discovery.py
          python -m ruff check \
            scripts/build_current_monitor_accountability.py \
            scripts/build_development_monitor_registry.py \
            scripts/build_monitoring_eligibility.py \
            scripts/evaluate_operational_health.py \
            scripts/run_operational_due_cycle.py \
            scripts/run_successor_discovery.py \
            scripts/source_lifecycle_overlay.py \
            tests/test_current_monitor_accountability.py \
            tests/test_development_monitor_registry.py \
            tests/test_monitoring_transition_manifest.py \
            tests/test_operational_health.py \
            tests/test_operational_health_route_resilience.py \
            tests/test_source_lifecycle_overlay.py \
            tests/test_successor_discovery.py
