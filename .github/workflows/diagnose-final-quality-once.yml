name: Diagnose final quality once

on:
  push:
    branches:
      - agent/31-lifecycle-successor-discovery
    paths:
      - ".github/workflows/diagnose-final-quality-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Checkout exact workbench runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 428b4e8d797c0729bc4f36678daec88711688689
          path: workbench
      - name: Install pinned runtime
        run: |
          python -m pip install --require-hashes -r workbench/requirements/constraints.txt
          python -m pip install --no-deps ./workbench
      - name: Compile all scripts and tests
        if: always()
        run: python -m compileall -q scripts tests
      - name: Format check successor script
        if: always()
        run: python -m ruff format --check scripts/run_successor_discovery.py
      - name: Format check lifecycle script
        if: always()
        run: python -m ruff format --check scripts/source_lifecycle_overlay.py
      - name: Format check transition manifest test
        if: always()
        run: python -m ruff format --check tests/test_monitoring_transition_manifest.py
      - name: Format check lifecycle test
        if: always()
        run: python -m ruff format --check tests/test_source_lifecycle_overlay.py
      - name: Format check successor test
        if: always()
        run: python -m ruff format --check tests/test_successor_discovery.py
      - name: Lint successor surface
        if: always()
        run: |
          python -m ruff check \
            scripts/run_successor_discovery.py \
            scripts/source_lifecycle_overlay.py \
            tests/test_monitoring_transition_manifest.py \
            tests/test_source_lifecycle_overlay.py \
            tests/test_successor_discovery.py
      - name: Run successor unit contract
        if: always()
        run: |
          python -m unittest \
            tests/test_monitoring_transition_manifest.py \
            tests/test_source_lifecycle_overlay.py \
            tests/test_successor_discovery.py -v
      - name: Format check full operational surface
        if: always()
        run: |
          python -m ruff format --check \
            scripts/build_current_monitor_accountability.py \
            scripts/build_development_monitor_registry.py \
            scripts/build_monitoring_eligibility.py \
            scripts/evaluate_operational_health.py \
            scripts/run_operational_due_cycle.py \
            scripts/run_successor_discovery.py \
            scripts/source_lifecycle_overlay.py \
            tests/test_current_monitor_accountability.py \
            tests/test_development_monitor_registry.py \
            tests/test_monitoring_transition_manifest.py \
            tests/test_operational_health.py \
            tests/test_operational_health_route_resilience.py \
            tests/test_source_lifecycle_overlay.py \
            tests/test_successor_discovery.py
      - name: Lint full operational surface
        if: always()
        run: |
          python -m ruff check \
            scripts/build_current_monitor_accountability.py \
            scripts/build_development_monitor_registry.py \
            scripts/build_monitoring_eligibility.py \
            scripts/evaluate_operational_health.py \
            scripts/run_operational_due_cycle.py \
            scripts/run_successor_discovery.py \
            scripts/source_lifecycle_overlay.py \
            tests/test_current_monitor_accountability.py \
            tests/test_development_monitor_registry.py \
            tests/test_monitoring_transition_manifest.py \
            tests/test_operational_health.py \
            tests/test_operational_health_route_resilience.py \
            tests/test_source_lifecycle_overlay.py \
            tests/test_successor_discovery.py
      - name: Full repository unit regression
        if: always()
        run: python -m unittest discover -s tests -v
