name: Diagnose final quality once

on:
  push:
    branches:
      - agent/31-lifecycle-successor-discovery
    paths:
      - ".github/workflows/diagnose-final-quality-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Checkout exact workbench runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 428b4e8d797c0729bc4f36678daec88711688689
          path: workbench
      - name: Install pinned runtime
        run: |
          python -m pip install --require-hashes -r workbench/requirements/constraints.txt
          python -m pip install --no-deps ./workbench
      - name: Lint successor script
        if: always()
        run: python -m ruff check scripts/run_successor_discovery.py
      - name: Lint lifecycle script
        if: always()
        run: python -m ruff check scripts/source_lifecycle_overlay.py
      - name: Lint transition manifest test
        if: always()
        run: python -m ruff check tests/test_monitoring_transition_manifest.py
      - name: Lint lifecycle test
        if: always()
        run: python -m ruff check tests/test_source_lifecycle_overlay.py
      - name: Lint successor test
        if: always()
        run: python -m ruff check tests/test_successor_discovery.py
      - name: Verify grouped successor lint
        if: always()
        run: |
          python -m ruff check \
            scripts/run_successor_discovery.py \
            scripts/source_lifecycle_overlay.py \
            tests/test_monitoring_transition_manifest.py \
            tests/test_source_lifecycle_overlay.py \
            tests/test_successor_discovery.py
