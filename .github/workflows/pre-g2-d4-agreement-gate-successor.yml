name: PRE-G2 real-execution hardening

on:
  pull_request:
    paths:
      - 'curation/HUMAN_D4_AGREEMENT_GATE_DISPOSITION_2026-09-12_v0.1.json'
      - 'curation/PRE_G2_D4_PILOT_READINESS_POLICY_2026-09-12_v0.2.json'
      - 'curation/PRE_G2_D4_PILOT_READINESS_POLICY_2026-09-23_v0.3.json'
      - 'scripts/build_pre_g2_d4_pilot_readiness_aggregate_v0_3.py'
      - 'scripts/evaluate_pre_g2_d4_pilot_readiness_v0_3.py'
      - 'scripts/execute_pre_g2_d4_final_selection_v0_3.py'
      - 'scripts/build_pre_g2_d3_challenge_pilot_readiness.py'
      - 'scripts/select_pre_g2_d3_challenge_held_out.py'
      - 'scripts/execute_pre_g2_d3_challenge_final_selection.py'
      - 'scripts/select_pre_g2_d4_held_out.py'
      - 'scripts/select_pre_g2_d4_held_out_v0_2.py'
      - 'tests/test_pre_g2_d3_challenge_sampling_calibration.py'
      - 'tests/test_pre_g2_d3_calibration_selection_composition.py'
      - 'tests/test_pre_g2_d4_pilot_execution.py'
      - 'tests/test_pre_g2_d4_pilot_readiness_v0_2.py'
      - 'tests/test_pre_g2_d4_agreement_gate_successor.py'
      - 'tests/test_pre_g2_d4_calibration_selection_composition_v0_2.py'
      - 'tests/test_pre_g2_d4_real_execution_hardening_v0_3.py'
      - '.github/workflows/pre-g2-d4-agreement-gate-successor.yml'
  push:
    branches: [main]
    paths:
      - 'curation/PRE_G2_D4_PILOT_READINESS_POLICY_2026-09-23_v0.3.json'
      - 'scripts/build_pre_g2_d4_pilot_readiness_aggregate_v0_3.py'
      - 'scripts/evaluate_pre_g2_d4_pilot_readiness_v0_3.py'
      - 'scripts/execute_pre_g2_d4_final_selection_v0_3.py'
      - 'scripts/build_pre_g2_d3_challenge_pilot_readiness.py'
      - 'scripts/select_pre_g2_d3_challenge_held_out.py'
      - 'scripts/execute_pre_g2_d3_challenge_final_selection.py'
      - 'scripts/select_pre_g2_d4_held_out.py'
      - 'scripts/select_pre_g2_d4_held_out_v0_2.py'
      - 'tests/test_pre_g2_d3_challenge_sampling_calibration.py'
      - 'tests/test_pre_g2_d3_calibration_selection_composition.py'
      - 'tests/test_pre_g2_d4_pilot_execution.py'
      - 'tests/test_pre_g2_d4_real_execution_hardening_v0_3.py'
      - '.github/workflows/pre-g2-d4-agreement-gate-successor.yml'

permissions:
  contents: read

jobs:
  validate-pre-g2-real-execution-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile active real-execution paths
        run: |
          python -m py_compile \
            scripts/build_pre_g2_d4_pilot_readiness_aggregate_v0_3.py \
            scripts/evaluate_pre_g2_d4_pilot_readiness_v0_3.py \
            scripts/execute_pre_g2_d4_final_selection_v0_3.py \
            scripts/build_pre_g2_d3_challenge_pilot_readiness.py \
            scripts/select_pre_g2_d3_challenge_held_out.py \
            scripts/execute_pre_g2_d3_challenge_final_selection.py \
            scripts/select_pre_g2_d4_held_out.py \
            scripts/select_pre_g2_d4_held_out_v0_2.py
      - name: Validate issue 271 hardening
        run: |
          python -m unittest tests.test_pre_g2_d4_real_execution_hardening_v0_3 -v
          python -m unittest tests.test_pre_g2_d3_challenge_sampling_calibration -v
          python -m unittest tests.test_pre_g2_d3_calibration_selection_composition -v
          python -m unittest tests.test_pre_g2_d4_pilot_execution -v
      - name: Preserve historical D4 v0.2 bindings
        run: |
          python -m unittest tests.test_pre_g2_d4_pilot_readiness_v0_2 -v
          python -m unittest tests.test_pre_g2_d4_agreement_gate_successor -v
          python -m unittest tests.test_pre_g2_d4_calibration_selection_composition_v0_2 -v
      - name: Authority boundary
        run: |
          echo "This workflow closes software hardening only for PRE-G2 real execution."
          echo "It does not execute a real D3/D4 pilot, create human approval, freeze a benchmark,"
          echo "pass G0/G2/G5, resolve rights, authorize population inference, mutate S2,"
          echo "authorize publication or Phase 4, or alter assessment state."
