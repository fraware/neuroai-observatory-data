name: Current monitor accountability

on:
  pull_request:
    paths:
      - "scripts/build_current_monitor_accountability.py"
      - "tests/test_current_monitor_accountability.py"
      - "analytics/operational-accountability/**"
      - ".github/workflows/current-monitor-accountability.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build_current_monitor_accountability.py"
      - "tests/test_current_monitor_accountability.py"
      - "analytics/operational-accountability/**"
      - ".github/workflows/current-monitor-accountability.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build exact current accountability
        run: python scripts/build_current_monitor_accountability.py --output-dir "$RUNNER_TEMP/accountability"
      - name: Run accountability contract tests
        run: python -m unittest tests/test_current_monitor_accountability.py -v
      - name: Publish workflow summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"accountability/current-monitoring-accountability.json").read_text())
          print("## Current monitoring accountability")
          print(f"- Effective sources: {data['current']['effective_source_count']}")
          print(f"- Current counts: `{data['current']['counts']}`")
          print(f"- Current gaps: `{data['current']['gap_source_ids']}`")
          print(f"- Candidate monitor records: {data['monitor_extension_candidate']['candidate_record_count']}")
          print(f"- Candidate coverage: {data['candidate_accountability']['coverage_fraction']:.3f}")
          print(f"- Projection SHA-256: `{data['projection_sha256']}`")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-monitor-accountability
          path: ${{ runner.temp }}/accountability
          retention-days: 14
