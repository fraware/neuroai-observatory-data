name: SU-REGULATION openFDA registration-listing recorded replay

on:
  pull_request:
    paths:
      - "curation/openfda_registration_listing_discovery_programme_v0.1.json"
      - "schemas/openfda-registration-listing-discovery-programme.schema.json"
      - "schemas/openfda-registration-listing-discovery-replay-input.schema.json"
      - "scripts/run_su_regulation_openfda_registration_listing_recorded_replay.py"
      - "scripts/validate_openfda_registration_listing_discovery_programme.py"
      - "tests/test_openfda_registration_listing_discovery_programme.py"
      - "tests/test_openfda_registration_listing_recorded_replay.py"
      - ".github/workflows/su-regulation-openfda-registration-listing-recorded-replay.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout exact proposed Workbench registration-listing capability
        uses: actions/checkout@v4
        with:
          repository: fraware/neuroai-workbench
          ref: dcd6cb4be22ee38e6396568caa70afa51ab87f37
          path: .workbench
          persist-credentials: false
      - name: Install exact Workbench tree
        run: python -m pip install --disable-pip-version-check -e .workbench
      - name: Verify exact projector
        run: |
          python - <<'PY'
          from neuroai_workbench.discovery import project_openfda_registration_listing_pages
          assert callable(project_openfda_registration_listing_pages)
          PY
      - name: Validate S2 programme and tests
        run: |
          python scripts/validate_openfda_registration_listing_discovery_programme.py
          python -m unittest tests/test_openfda_registration_listing_discovery_programme.py
          python -m unittest tests/test_openfda_registration_listing_recorded_replay.py
      - name: Run exact Workbench projection tests
        run: python .workbench/tests/test_openfda_registration_listing_discovery_projection.py
      - name: Exercise exact Workbench projector through S2 replay boundary
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          import run_su_regulation_openfda_registration_listing_recorded_replay as replay
          p=replay._programme();s=p["query_streams"][0]
          page={"meta":{"results":{"total":1,"skip":0,"limit":1000}},"results":[{
            "establishment_type":["Manufacture Medical Device"],"k_number":"K123456","pma_number":"P123456","proprietary_name":["Neural Interface X"],
            "products":[
              {"created_date":"2026-01-01","exempt":"N","owner_operator_number":"9051149","product_code":"ABC","openfda":{"device_class":"2","device_name":"Neural interface device","regulation_number":"882.9999"}},
              {"created_date":"2026-01-02","exempt":"N","owner_operator_number":"9051149","product_code":"XYZ","openfda":{"device_class":"3","device_name":"Implanted neural device","regulation_number":"882.9998"}}
            ],
            "registration":{"registration_number":"9610240","fei_number":"3002808212","name":"Example Establishment","status_code":"1","reg_expiry_date_year":"2027","address_line_1":"EXCLUDED ADDRESS","city":"EXCLUDED CITY","owner_operator":{"owner_operator_number":"9051149","contact_address":{"address1":"EXCLUDED OWNER ADDRESS"},"official_correspondent":{"email":"EXCLUDED CORRESPONDENT"}},"us_agent":{"email":"EXCLUDED AGENT"}}
          }]}
          bundle={"schema_version":"0.1.0","programme_id":p["programme_id"],"provider":p["provider_contract"]["provider"],"capture_scope":"PARTIAL_VALIDATION","captured_at":"2026-09-01T00:00:00Z","leaf_query_captures":[{"query_id":s["query_id"],"leaf_query_id":"integration-root","effective_search":s["search"],"partition_path":[],"pages":[page]}]}
          result=replay.build_replay(bundle)
          assert result["reconciliation"]["materialized_source_namespace_count"]==248
          assert result["reconciliation"]["returned_provider_record_count"]==1
          assert result["reconciliation"]["expanded_representation_count"]==2
          assert result["reconciliation"]["union_unique_representation_count"]==2
          assert result["reconciliation"]["leaf_mechanical_blocker_count"]==0
          assert result["reconciliation"]["mechanically_complete"] is False
          for row in result["normalized_records"]:
              assert row["representation_is_exact_device_identity"] is False
              assert row["registration_or_listing_establishes_authorization"] is False
              assert row["k_number"]=="K123456" and row["pma_number"]=="P123456"
          text=str(result)
          for secret in ("EXCLUDED ADDRESS","EXCLUDED CITY","EXCLUDED OWNER ADDRESS","EXCLUDED CORRESPONDENT","EXCLUDED AGENT"):assert secret not in text
          assert result["reconciliation"]["registration_or_listing_is_marketing_authorization"] is False
          assert result["reconciliation"]["registration_or_listing_is_clearance_or_approval"] is False
          assert result["reconciliation"]["k_or_pma_reference_establishes_exact_configuration_authorization"] is False
          assert result["reconciliation"]["canonical_successor_ready"] is False
          PY
      - name: Verify no raw registration-listing capture is committed
        run: |
          if find . -path './.git' -prune -o -path './.workbench' -prune -o -type f \( -iname '*registration*raw*.json' -o -iname '*listing*page*.json' -o -iname '*registration*response*.json' \) -print | grep -q .; then
            echo "Raw registration/listing replay pages must remain external/ephemeral." >&2
            exit 1
          fi
