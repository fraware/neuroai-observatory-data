name: vNext core graph contract

on:
  pull_request:
    paths:
      - "ontology/vocabulary-v0.1.json"
      - "ontology/predicates-v0.1.json"
      - "schemas/vnext/**"
      - "fixtures/vnext/**"
      - "scripts/validate_vnext_core.py"
      - "tests/test_vnext_core_contract.py"
      - ".github/workflows/vnext-core-schema.yml"
  push:
    branches: [main]
    paths:
      - "ontology/vocabulary-v0.1.json"
      - "ontology/predicates-v0.1.json"
      - "schemas/vnext/**"
      - "fixtures/vnext/**"
      - "scripts/validate_vnext_core.py"
      - "tests/test_vnext_core_contract.py"
      - ".github/workflows/vnext-core-schema.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema[format]==4.26.0"
      - name: Validate synthetic vNext core bundle
        run: python scripts/validate_vnext_core.py
      - name: Contract and adversarial tests
        run: python -m unittest tests/test_vnext_core_contract.py -v
