name: vNext core graph contract

on:
  pull_request:
    paths:
      - "ontology/vocabulary-v0.1.json"
      - "ontology/predicates-v0.1.json"
      - "schemas/vnext/**"
      - "fixtures/vnext/**"
      - "scripts/validate_vnext_core.py"
      - "tests/test_vnext_core_contract.py"
      - ".github/workflows/vnext-core-schema.yml"
  push:
    branches: [main]
    paths:
      - "ontology/vocabulary-v0.1.json"
      - "ontology/predicates-v0.1.json"
      - "schemas/vnext/**"
      - "fixtures/vnext/**"
      - "scripts/validate_vnext_core.py"
      - "tests/test_vnext_core_contract.py"
      - ".github/workflows/vnext-core-schema.yml"

permissions:
  contents: read

env:
  VALIDATION_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VALIDATION_REF }}
          persist-credentials: false
      - name: Assert checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATION_REF"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema[format]==4.26.0"
      - name: Verify validation runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from importlib.metadata import version

          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"expected Python 3.12, observed {sys.version.split()[0]}")
          observed = version("jsonschema")
          if observed != "4.26.0":
              raise SystemExit(f"expected jsonschema 4.26.0, observed {observed}")
          print(f"python={sys.version.split()[0]}")
          print(f"jsonschema={observed}")
          PY
          python -m pip check
      - name: Validate synthetic vNext core bundle
        run: python scripts/validate_vnext_core.py
      - name: Contract and adversarial tests
        run: python -m unittest tests/test_vnext_core_contract.py -v
