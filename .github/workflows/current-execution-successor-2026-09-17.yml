name: Current execution successor 2026-09-17

on:
  pull_request:
    paths:
      - 'curation/PROGRAMME_EXECUTION_STATE_2026-09-17_CONTROL_DELTA_SUCCESSOR.json'
      - 'curation/CURRENT_EXECUTION_CONTROL.json'
      - 'tests/test_current_execution_successor_2026_09_17.py'
      - 'tests/test_current_execution_successor_2026_09_14_pre_g3.py'
      - '.github/workflows/current-execution-successor-2026-09-17.yml'
  push:
    branches: [main]
    paths:
      - 'curation/PROGRAMME_EXECUTION_STATE_2026-09-17_CONTROL_DELTA_SUCCESSOR.json'
      - 'curation/CURRENT_EXECUTION_CONTROL.json'
      - 'tests/test_current_execution_successor_2026_09_17.py'
      - 'tests/test_current_execution_successor_2026_09_14_pre_g3.py'
      - '.github/workflows/current-execution-successor-2026-09-17.yml'

permissions:
  contents: read

jobs:
  validate-current-execution-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate execution-control JSON
        run: |
          python -m json.tool curation/PROGRAMME_EXECUTION_STATE_2026-09-17_CONTROL_DELTA_SUCCESSOR.json >/dev/null
          python -m json.tool curation/CURRENT_EXECUTION_CONTROL.json >/dev/null
      - name: Validate current successor and historical predecessor
        run: |
          python -m unittest tests.test_current_execution_successor_2026_09_17 -v
          python -m unittest tests.test_current_execution_successor_2026_09_14_pre_g3 -v
      - name: Authority boundary
        run: |
          echo "This workflow validates append-only execution-state bookkeeping only."
          echo "CT.gov onboarding/first-capture controls are software controls without a real human disposition or live capture."
          echo "Roman PATSTAT evidence is partial provenance only; readiness and rights remain unresolved."
          echo "G0 remains blocked on SRC-14-021; G2/G3/G5 remain false; Workbench Phase 3 remains unexecuted."
          echo "No human benchmark, canonical S2/publication, population, Phase 4, legal, scientific-validity, or assessment authority is created."
