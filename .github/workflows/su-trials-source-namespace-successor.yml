name: SU-TRIALS Source-namespace successor

on:
  pull_request:
    paths:
      - 'schemas/su-trials-human-decision-packet.schema.json'
      - 'schemas/source-namespace-successor-proposal.schema.json'
      - 'scripts/adjudicate_su_trials_source_namespace.py'
      - 'tests/test_su_trials_source_namespace_successor.py'
      - '.github/workflows/su-trials-source-namespace-successor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudication-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Checkout exact current Workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 33414065e53c45221d29209ef4703b6d900781f7
          path: .workbench
          persist-credentials: false
      - name: Install exact Workbench tree
        run: python -m pip install --disable-pip-version-check -e .workbench
      - name: Parse schemas and compile bridges
        run: |
          python -m json.tool schemas/su-trials-human-decision-packet.schema.json >/dev/null
          python -m json.tool schemas/source-namespace-successor-proposal.schema.json >/dev/null
          python -m py_compile scripts/run_su_trials_recorded_replay.py scripts/stage_su_trials_human_review.py scripts/adjudicate_su_trials_source_namespace.py
      - name: Run Source-namespace successor tests
        run: python -m unittest tests.test_su_trials_source_namespace_successor
      - name: Assert Workbench adjudication successor suppression contract
        run: |
          python - <<'PY'
          import inspect
          from neuroai_workbench.discovery import adjudicate_candidate_source
          sig=inspect.signature(adjudicate_candidate_source)
          assert 'create_successor' in sig.parameters
          assert sig.parameters['create_successor'].default is True
          # This S2 bridge always supplies create_successor=False and separately guards
          # discovery/registry_successors against any file creation.
          PY
