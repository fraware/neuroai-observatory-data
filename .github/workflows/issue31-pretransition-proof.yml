name: Issue 31 pretransition proof

on:
  push:
    branches:
      - agent/31-lifecycle-successor-discovery
    paths:
      - ".github/workflows/issue31-pretransition-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Checkout exact workbench lifecycle stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 428b4e8d797c0729bc4f36678daec88711688689
          path: workbench
      - name: Install hash-locked workbench runtime
        run: |
          python -m pip install --require-hashes -r workbench/requirements/constraints.txt
          python -m pip install --no-deps ./workbench
      - name: Run current pretransition live cycle
        run: |
          rm -rf "$RUNNER_TEMP/neuroai-live"
          mkdir -p "$RUNNER_TEMP/neuroai-live"
          python scripts/run_operational_due_cycle.py \
            --workspace "$RUNNER_TEMP/neuroai-live/workspace" \
            --route-policy curation/source_route_resilience_v0.1.json \
            --output "$RUNNER_TEMP/neuroai-live/operational-live-report.json" \
            --max-workers 12 \
            --max-workers-per-host 2 \
            --performance-budget-seconds 300
      - name: Enforce pretransition evidence invariants
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "neuroai-live/operational-live-report.json").read_text())
          routes = {item["source_id"]: item for item in report["route_resilience"]["sources"]}
          ct = routes["SRC-PR-002"]
          science = routes["SRC-PR-015"]
          assert report["health"]["engineering_state"] == "READY"
          assert report["health"]["source_resolution_state"] == "HEALTHY"
          assert report["health"]["active_source_availability_state"] == "HEALTHY"
          assert report["health"]["active_evidence_payload_availability_state"] == "HEALTHY"
          assert report["execution"]["slo"]["source_accountability_coverage"] == 1.0
          assert report["execution"]["slo"]["target_execution_coverage"] == 1.0
          assert report["resume_proof"]["additional_transport_sends"] == 0
          assert ct["availability_state"] == "AVAILABLE_PRIMARY"
          assert ct["selected_route_id"] == "SRC-PR-002:api-v2-single"
          assert science["lifecycle"]["resolution_state"] == "RESOLVED_LIFECYCLE_CHANGE"
          assert science["lifecycle"]["lifecycle_state"] == "NO_LONGER_LISTED"
          assert science["lifecycle"]["source_active_expected"] is False
          assert science["lifecycle"]["evidence_substitution_allowed"] is False
          sanitized = {
              "generated_at": report["generated_at"],
              "registry": report["registry"],
              "execution": {
                  "execution_status": report["execution"]["execution_status"],
                  "slo": report["execution"]["slo"],
                  "semantic_summary_sha256": report["execution"]["semantic_summary_sha256"],
                  "transport_sends": report["execution"]["transport_sends"],
              },
              "route_resilience": report["route_resilience"],
              "resume_proof": report["resume_proof"],
              "health": {
                  "state": report["health"]["state"],
                  "engineering_state": report["health"]["engineering_state"],
                  "source_resolution_state": report["health"]["source_resolution_state"],
                  "active_source_availability_state": report["health"]["active_source_availability_state"],
                  "active_evidence_payload_availability_state": report["health"]["active_evidence_payload_availability_state"],
              },
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "issue31-pretransition-evidence.json"
          output.write_text(json.dumps(sanitized, indent=2, sort_keys=True) + "\n")
          print(json.dumps({
              "route_report_sha256": report["route_resilience"]["report_sha256"],
              "policy_sha256": report["route_resilience"]["policy_sha256"],
              "science_lifecycle_report_sha256": science["lifecycle"]["report_sha256"],
              "semantic_summary_sha256": report["execution"]["semantic_summary_sha256"],
          }, sort_keys=True))
          PY
      - name: Upload sanitized pretransition evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue31-pretransition-evidence
          path: ${{ runner.temp }}/issue31-pretransition-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Prove protected material remains ephemeral
        run: |
          rm -rf workbench
          git status --porcelain
          test -z "$(git status --porcelain)"
