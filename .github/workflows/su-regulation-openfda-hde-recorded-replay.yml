name: SU-REGULATION openFDA HDE recorded replay
on:
  pull_request:
    paths:
      - 'curation/openfda_hde_discovery_programme_v0.1.json'
      - 'schemas/openfda-hde-discovery-programme.schema.json'
      - 'schemas/openfda-hde-discovery-replay-input.schema.json'
      - 'scripts/current_source_namespace.py'
      - 'scripts/run_su_regulation_openfda_hde_recorded_replay.py'
      - 'scripts/validate_openfda_hde_discovery_programme.py'
      - 'tests/test_openfda_hde_discovery_programme.py'
      - 'tests/test_openfda_hde_recorded_replay.py'
      - '.github/workflows/su-regulation-openfda-hde-recorded-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Checkout exact merged Workbench HDE capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 5be514d71ef678ac546ed60c97c1e7aacb0f0583
          path: .workbench
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -e .workbench
      - run: python -m json.tool schemas/openfda-hde-discovery-replay-input.schema.json >/dev/null
      - run: python scripts/validate_openfda_hde_discovery_programme.py
      - run: python -m unittest tests.test_openfda_hde_discovery_programme tests.test_openfda_hde_recorded_replay
      - name: Run exact Workbench HDE projector tests
        run: python .workbench/tests/test_openfda_hde_discovery_projection.py
      - name: Exercise approval/effectiveness/IRB separation through current S2 replay
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import run_su_regulation_openfda_hde_recorded_replay as replay
          p=replay._programme();s=p['query_streams'][0]
          page={'meta':{'results':{'total':3,'skip':0,'limit':1000}},'results':[
            {'pma_number':'H123456','supplement_number':None,'trade_name':'HUD Device','decision_code':'APPR','openfda':{'manufacturer_name':['MUST-NOT-PROJECT']}},
            {'pma_number':'H123456','supplement_number':'S001','trade_name':'HUD Device','decision_code':'WTDR'},
            {'pma_number':'P123456','decision_code':'APPR'}
          ]}
          bundle={'schema_version':'0.1.0','programme_id':p['programme_id'],'provider':p['provider_contract']['provider'],'capture_scope':'PARTIAL_VALIDATION','captured_at':'2026-09-02T00:00:00Z','leaf_query_captures':[{'query_id':s['query_id'],'leaf_query_id':'integration-root','effective_search':s['search'],'partition_path':[],'pages':[page]}]}
          result=replay.build_replay(bundle);records={x['record_identity']:x for x in result['normalized_hde_records']};q=result['reconciliation']
          assert set(records)=={'HDE:H123456:ORIGINAL','HDE:H123456:S001'}
          original=records['HDE:H123456:ORIGINAL']
          assert original['decision_semantics']=='HDE_APPROVAL_RECORDED'
          assert original['decision_supports_hde_approval'] is True
          assert original['decision_supports_reasonable_assurance_of_effectiveness'] is False
          assert original['decision_establishes_facility_irb_approval'] is False
          assert records['HDE:H123456:S001']['decision_semantics']=='WITHDRAWAL_RECORDED'
          assert 'openfda' not in original
          assert q['out_of_scope_non_h_prefix_count']==1
          assert q['hde_approval_is_reasonable_assurance_effectiveness_claim'] is False
          assert q['hde_approval_establishes_facility_irb_approval'] is False
          assert q['canonical_successor_ready'] is False
          PY
      - name: Verify no raw HDE capture is committed
        run: |
          if find . -path './.git' -prune -o -path './.workbench' -prune -o -type f \( -iname '*hde*raw*.json' -o -iname '*hde*response*.json' -o -iname '*hde*page*.json' \) -print | grep -q .; then
            echo 'Raw openFDA HDE pages must remain external/ephemeral.' >&2
            exit 1
          fi
