name: Capture issue 31 Ruff diagnostics once

on:
  push:
    branches:
      - agent/31-lifecycle-successor-discovery
    paths:
      - ".github/workflows/capture-issue31-ruff-once.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/31-lifecycle-successor-discovery
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Checkout exact workbench runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 428b4e8d797c0729bc4f36678daec88711688689
          path: workbench
      - name: Install pinned runtime
        run: |
          python -m pip install --require-hashes -r workbench/requirements/constraints.txt
          python -m pip install --no-deps ./workbench
      - name: Capture structured Ruff findings
        run: |
          mkdir -p .diagnostics
          python -m ruff check --output-format=json \
            scripts/run_successor_discovery.py \
            scripts/source_lifecycle_overlay.py > .diagnostics/issue31-ruff.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.diagnostics/issue31-ruff.json')
          findings = json.loads(p.read_text() or '[]')
          p.write_text(json.dumps(findings, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit diagnostics
        run: |
          rm -rf workbench
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/issue31-ruff.json
          git commit -m "Capture exact issue 31 Ruff findings"
          git push origin HEAD:agent/31-lifecycle-successor-discovery
