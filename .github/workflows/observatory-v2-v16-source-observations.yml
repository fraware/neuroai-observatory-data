name: Observatory v2 v1.6 source observations

on:
  pull_request:
    paths:
      - "schemas/observatory-v2-source.schema.json"
      - "schemas/observatory-v1-observation.schema.json"
      - "scripts/project_v16_sources_observations_to_v2.py"
      - "tests/test_v16_source_observation_v2_projection.py"
      - ".github/workflows/observatory-v2-v16-source-observations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify governing release manifest
        run: >-
          python scripts/verify_manifest.py
          releases/data-v0.1.0-public-governing/records
          releases/data-v0.1.0-public-governing/SHA256SUMS.txt

      - name: Run v1.6 source/observation migration tests
        run: python -m unittest tests.test_v16_source_observation_v2_projection

      - name: Reconcile v1.6 source and observation slice
        run: |
          python scripts/project_v16_sources_observations_to_v2.py --output-dir /tmp/v2-v16-source-observations > /tmp/v2-v16-source-observations-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/v2-v16-source-observations/reconciliation.json').read_text())
          assert result['input_source_count'] == 12
          assert result['input_check_count'] == 12
          assert result['projected_source_count'] == 12
          assert result['projected_observation_count'] == 12
          assert result['one_to_one_source_check_pair_count'] == 12
          assert result['exact_timestamp_observation_count'] == 12
          assert result['source_published_date_count'] == 10
          assert result['source_published_unresolved_count'] == 2
          assert result['content_hash_unavailable_count'] == 12
          assert result['new_or_backfill_comparison_count'] == 10
          assert result['no_material_change_comparison_count'] == 2
          for key in (
              'source_identity_loss_count',
              'source_payload_roundtrip_failure_count',
              'observation_payload_roundtrip_failure_count',
              'claim_boundary_loss_count',
              'source_reference_loss_count',
              'content_hash_fabrication_count',
              'locator_fabrication_count',
              'http_metadata_fabrication_count',
              'temporal_precision_fabrication_count',
              'protected_bytes_in_public_record_count',
          ):
              assert result[key] == 0, (key, result[key])
          assert result['canonical_successor_ready'] is False
          PY
