name: SU-GRANTS NIH RePORTER programme

on:
  pull_request:
    paths:
      - 'curation/nih_reporter_grants_discovery_programme_v0.1.json'
      - 'schemas/nih-reporter-grants-discovery-programme.schema.json'
      - 'scripts/validate_nih_reporter_grants_discovery_programme.py'
      - 'tests/test_nih_reporter_grants_discovery_programme.py'
      - 'curation/source_universe_registry_v0.1.json'
      - '.github/workflows/su-grants-nih-reporter-programme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-programme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Parse controls
        run: |
          python -m json.tool curation/nih_reporter_grants_discovery_programme_v0.1.json >/dev/null
          python -m json.tool schemas/nih-reporter-grants-discovery-programme.schema.json >/dev/null
      - name: Validate bounded programme
        run: python scripts/validate_nih_reporter_grants_discovery_programme.py
      - name: Run focused tests
        run: python -m unittest tests.test_nih_reporter_grants_discovery_programme
      - name: Assert nonnetwork and nonauthority boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('curation/nih_reporter_grants_discovery_programme_v0.1.json',encoding='utf-8'))
          assert p['workbench_dependency']['integration_state']=='AVAILABLE'
          assert p['provider_contract']['configuration_performs_http'] is False
          assert p['network_policy']['live_execution']=='OPT_IN_ONLY'
          assert p['pagination_partition_policy']['silent_truncation_allowed'] is False
          assert p['incremental_refresh_policy']['watermark_does_not_replace_historical_baseline'] is True
          assert p['inclusion_policy']['automatic_grant_source_admission'] is False
          assert p['inclusion_policy']['automatic_project_entity_creation'] is False
          assert p['inclusion_policy']['automatic_funding_success_claim_creation'] is False
          assert p['coverage_contract']['global_neuroai_grant_recall_claim'] is False
          PY
