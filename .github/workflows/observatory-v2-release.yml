name: Observatory v2 release contract

on:
  pull_request:
    paths:
      - "scripts/verify_observatory_v2_release.py"
      - "scripts/run_pre_g0_b02_controlled_live_proof.py"
      - "tests/test_observatory_v2_release_contract.py"
      - "tests/test_production_monitoring_hardening.py"
      - "schemas/observatory-v2-*.schema.json"
      - "releases/data-v0.3.0-observatory-v2*/**"
      - "docs/observatory-v2-release-contract.md"
      - ".github/workflows/observatory-v2-release.yml"
      - ".github/workflows/operational-live-cycle.yml"
      - ".github/workflows/successor-discovery.yml"
      - ".github/workflows/operational-interruption-resume-drill.yml"
      - ".github/workflows/pre-g0-b02-controlled-live-proof.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify_observatory_v2_release.py"
      - "scripts/run_pre_g0_b02_controlled_live_proof.py"
      - "tests/test_observatory_v2_release_contract.py"
      - "tests/test_production_monitoring_hardening.py"
      - "schemas/observatory-v2-*.schema.json"
      - "releases/data-v0.3.0-observatory-v2*/**"
      - "docs/observatory-v2-release-contract.md"
      - ".github/workflows/observatory-v2-release.yml"
      - ".github/workflows/operational-live-cycle.yml"
      - ".github/workflows/successor-discovery.yml"
      - ".github/workflows/operational-interruption-resume-drill.yml"
      - ".github/workflows/pre-g0-b02-controlled-live-proof.yml"

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Parse v2 release schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("schemas").glob("observatory-v2-*.schema.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY
      - name: Observatory v2 release contract tests
        run: python -m unittest tests/test_observatory_v2_release_contract.py -v
      - name: Production monitoring hardening contract
        run: python -m unittest tests/test_production_monitoring_hardening.py -v
