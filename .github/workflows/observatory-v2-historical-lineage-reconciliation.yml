name: Observatory v2 historical lineage reconciliation

on:
  pull_request:
    paths:
      - 'curation/OBSERVATORY_V2_HISTORICAL_LINEAGE_RECONCILIATION_2026-09-17_v0.1.json'
      - 'scripts/current_source_namespace.py'
      - 'tests/test_observatory_v2_historical_lineage_reconciliation_2026_09_17.py'
      - '.github/workflows/observatory-v2-historical-lineage-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'curation/OBSERVATORY_V2_HISTORICAL_LINEAGE_RECONCILIATION_2026-09-17_v0.1.json'
      - 'scripts/current_source_namespace.py'
      - 'tests/test_observatory_v2_historical_lineage_reconciliation_2026_09_17.py'
      - '.github/workflows/observatory-v2-historical-lineage-reconciliation.yml'

permissions:
  contents: read

jobs:
  reconcile-historical-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Parse reconciliation control
        run: python -m json.tool curation/OBSERVATORY_V2_HISTORICAL_LINEAGE_RECONCILIATION_2026-09-17_v0.1.json >/dev/null

      - name: Validate historical lineage mapping and live 248-Source namespace
        run: python -m unittest tests.test_observatory_v2_historical_lineage_reconciliation_2026_09_17 -v

      - name: Authority boundary
        run: |
          echo 'This workflow reconciles stale historical implementation issues only.'
          echo 'It does not promote PR #86/#88 to main, create a production S2 candidate, authorize or publish a release, or pass G0/G2/G3/G5.'
