name: Operational live due cycle

on:
  push:
    branches:
      - agent/31-lifecycle-successor-discovery
    paths:
      - "scripts/run_operational_due_cycle.py"
      - "scripts/evaluate_operational_health.py"
      - "scripts/probe_source_route_resilience.py"
      - "scripts/source_lifecycle_overlay.py"
      - "scripts/build_monitoring_eligibility.py"
      - "scripts/build_current_monitor_accountability.py"
      - "scripts/build_development_monitor_registry.py"
      - "tests/test_current_monitor_accountability.py"
      - "tests/test_development_monitor_registry.py"
      - "tests/test_operational_health.py"
      - "tests/test_operational_health_route_resilience.py"
      - "tests/test_source_lifecycle_overlay.py"
      - "tests/test_source_route_resilience.py"
      - "curation/source_route_resilience_v0.1.json"
      - "curation/source_lifecycle_monitoring_overlay_v0.1.json"
      - "fixtures/source_monitor_registry_v1.5.json"
      - "supplemental_records/**"
      - ".github/workflows/operational-live-cycle.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroai-operational-live-cycle
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify lifecycle-aware accountability and health contracts
        run: |
          python -m unittest \
            tests/test_current_monitor_accountability.py \
            tests/test_development_monitor_registry.py \
            tests/test_operational_health.py \
            tests/test_operational_health_route_resilience.py \
            tests/test_source_lifecycle_overlay.py \
            tests/test_source_route_resilience.py -v

  live:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Checkout exact merged workbench lifecycle stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fraware/neuroai-workbench
          ref: 428b4e8d797c0729bc4f36678daec88711688689
          path: workbench
      - name: Install hash-locked exact workbench runtime
        run: |
          python -m pip install --require-hashes -r workbench/requirements/constraints.txt
          python -m pip install --no-deps ./workbench
      - name: Execute lifecycle-aware live due cycle and exact-resume proof
        run: |
          rm -rf "$RUNNER_TEMP/neuroai-live"
          mkdir -p "$RUNNER_TEMP/neuroai-live"
          python scripts/run_operational_due_cycle.py \
            --workspace "$RUNNER_TEMP/neuroai-live/workspace" \
            --route-policy curation/source_route_resilience_v0.1.json \
            --lifecycle-overlay curation/source_lifecycle_monitoring_overlay_v0.1.json \
            --output "$RUNNER_TEMP/neuroai-live/operational-live-report.json" \
            --max-workers 12 \
            --max-workers-per-host 2 \
            --performance-budget-seconds 300
      - name: Enforce post-transition invariants
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "neuroai-live"
          report = json.loads((root / "operational-live-report.json").read_text())
          health = report["health"]
          execution = report["execution"]
          routes = report["route_resilience"]
          registry = report["registry"]

          assert registry["effective_sources"] == 248
          assert registry["automatic_monitors"] == 226
          assert registry["lifecycle_resolved_sources"] == 1
          assert registry["lifecycle_resolved_source_ids"] == ["SRC-PR-015"]
          assert report["lifecycle_overlay"]["transition_count"] == 1
          assert report["plan"]["lifecycle_resolved_source_ids_excluded"] == ["SRC-PR-015"]
          assert routes["excluded_lifecycle_source_ids"] == ["SRC-PR-015"]

          route_sources = {item["source_id"]: item for item in routes["sources"]}
          assert "SRC-PR-015" not in route_sources
          assert set(route_sources) == {"SRC-PR-002"}
          clinical = route_sources["SRC-PR-002"]
          assert clinical["availability_state"] == "AVAILABLE_PRIMARY"
          assert clinical["selected_route_id"] == "SRC-PR-002:api-v2-single"
          primary_obs = [
              item for item in clinical["route_observations"]
              if item.get("route_id") == "SRC-PR-002:api-v2-single"
          ]
          assert len(primary_obs) == 1
          assert primary_obs[0].get("http_status") == 200
          assert primary_obs[0].get("identity_match") is True

          assert health["engineering_state"] == "READY", health
          assert health["source_resolution_state"] == "HEALTHY", health
          assert health["active_source_availability_state"] == "HEALTHY", health
          assert health["active_evidence_payload_availability_state"] == "HEALTHY", health
          assert execution["slo"]["source_accountability_coverage"] == 1.0
          assert execution["slo"]["target_execution_coverage"] == 1.0
          assert report["resume_proof"]["additional_transport_sends"] == 0

          target_root = root / "workspace/quarantine/run-ledgers" / execution["run_id"] / "targets"
          target_source_ids = set()
          for path in target_root.glob("*.json"):
              checkpoint = json.loads(path.read_text())
              target_source_ids.update(checkpoint.get("target", {}).get("source_ids", []))
          assert "SRC-PR-015" not in target_source_ids

          print("POST_TRANSITION_PROOF=" + json.dumps({
              "automatic_monitors": registry["automatic_monitors"],
              "effective_sources": registry["effective_sources"],
              "lifecycle_resolved_source_ids": registry["lifecycle_resolved_source_ids"],
              "route_source_ids": sorted(route_sources),
              "clinical_primary_status": primary_obs[0]["http_status"],
              "clinical_identity_match": primary_obs[0]["identity_match"],
              "source_accountability_coverage": execution["slo"]["source_accountability_coverage"],
              "target_execution_coverage": execution["slo"]["target_execution_coverage"],
              "resume_additional_sends": report["resume_proof"]["additional_transport_sends"],
              "health_report_sha256": health["health_report_sha256"],
              "route_report_sha256": routes["report_sha256"],
          }, sort_keys=True))
          PY
      - name: Prove protected capture material was not added to repository
        run: |
          rm -rf workbench
          git status --porcelain
          test -z "$(git status --porcelain)"
