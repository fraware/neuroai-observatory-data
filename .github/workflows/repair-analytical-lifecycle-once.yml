name: Repair analytical lifecycle checkpoint once

on:
  push:
    branches:
      - fix/analytical-lifecycle-checkpoint
    paths:
      - ".github/workflows/repair-analytical-lifecycle-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/analytical-lifecycle-checkpoint
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Repair analytical lifecycle contract
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/analytical-projection.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          output = []
          for line in lines:
              output.append(line)
              if line == '      - "scripts/build_monitoring_eligibility.py"':
                  output.append('      - "scripts/source_lifecycle_overlay.py"')
              elif line == '      - "tests/test_build_monitoring_eligibility.py"':
                  output.append('      - "tests/test_source_lifecycle_overlay.py"')
              elif line == '      - "curation/source_namespace_eligibility_policy_v0.1.json"':
                  output.append('      - "curation/source_route_resilience_v0.1.json"')
                  output.append('      - "curation/source_lifecycle_monitoring_overlay_v0.1.json"')

          lines = output
          output = []
          stale = '          assert set(payload["unmonitored_mode_counts"]).issubset({"RECURRING", "ON_CHANGE", "ARCHIVAL_STATIC"})'
          for line in lines:
              if line == '      - uses: actions/checkout@v4':
                  line = '      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
              elif line == '      - uses: actions/setup-python@v5':
                  line = '      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
              output.append(line)
              if line == '          assert metadata["unmonitored_effective_source_count"] == 24, metadata':
                  output.append('          assert metadata["lifecycle_resolved_source_count"] == 1, metadata')
              if line == stale:
                  output.pop()
                  output.extend([
                      '          assert payload["unmonitored_mode_counts"] == {',
                      '              "ARCHIVAL_STATIC": 15,',
                      '              "LIFECYCLE_RESOLVED_ARCHIVAL": 1,',
                      '              "ON_CHANGE": 6,',
                      '              "RECURRING": 2,',
                      '          }, payload["unmonitored_mode_counts"]',
                      '',
                      '          lifecycle = [',
                      '              row for row in rows',
                      '              if row["recommended_mode"] == "LIFECYCLE_RESOLVED_ARCHIVAL"',
                      '          ]',
                      '          assert len(lifecycle) == 1, lifecycle',
                      '          assert lifecycle[0]["source_id"] == "SRC-PR-015", lifecycle[0]',
                      '          assert lifecycle[0]["monitor_present"] is False, lifecycle[0]',
                      '          assert lifecycle[0]["lifecycle_state"] == "NO_LONGER_LISTED", lifecycle[0]',
                      '          assert lifecycle[0]["successor_discovery_watch_id"] == "DISC-SCIENCE-CAREERS-001", lifecycle[0]',
                  ])
          if stale not in lines:
              raise SystemExit('stale analytical checkpoint not found exactly')
          workflow.write_text('\n'.join(output) + '\n', encoding='utf-8')

          test = Path('tests/test_build_monitoring_eligibility.py')
          lines = test.read_text(encoding='utf-8').splitlines()
          marker = '    def test_duplicate_or_missing_effective_source_ids_fail(self) -> None:'
          if marker not in lines:
              raise SystemExit('unit-test insertion marker not found')
          if not any('test_lifecycle_transition_has_distinct_archival_state' in line for line in lines):
              idx = lines.index(marker)
              addition = [
                  '    def test_lifecycle_transition_has_distinct_archival_state(self) -> None:',
                  '        sources = [_source("SRC-LIFE", "COMPANY_OPERATIONAL_CAPACITY_SIGNAL")]',
                  '        transition = {',
                  '            "SRC-LIFE": {',
                  '                "lifecycle_state": "NO_LONGER_LISTED",',
                  '                "successor_discovery_watch_id": "DISC-TEST-001",',
                  '                "transition_sha256": "a" * 64,',
                  '            }',
                  '        }',
                  '        result = eligibility.classify_monitoring(sources, [], transition)',
                  '        row = result["sources"][0]',
                  '        self.assertFalse(row["monitor_present"])',
                  '        self.assertEqual(row["recommended_mode"], "LIFECYCLE_RESOLVED_ARCHIVAL")',
                  '        self.assertIsNone(row["recommended_cadence"])',
                  '        self.assertEqual(row["lifecycle_state"], "NO_LONGER_LISTED")',
                  '        self.assertEqual(row["successor_discovery_watch_id"], "DISC-TEST-001")',
                  '        self.assertEqual(result["metadata"]["lifecycle_resolved_source_count"], 1)',
                  '        self.assertEqual(',
                  '            result["unmonitored_mode_counts"], {"LIFECYCLE_RESOLVED_ARCHIVAL": 1}',
                  '        )',
                  '',
              ]
              lines[idx:idx] = addition
          test.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m unittest tests/test_build_monitoring_eligibility.py tests/test_source_lifecycle_overlay.py -v
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/analytical-projection.yml tests/test_build_monitoring_eligibility.py
          git diff --cached --check
          git commit -m "Make analytical checkpoint lifecycle-aware"
          git push origin HEAD:fix/analytical-lifecycle-checkpoint
