name: SU-TRIALS recorded replay

on:
  pull_request:
    paths:
      - "curation/clinicaltrials_discovery_programme_v0.1.json"
      - "schemas/clinicaltrials-discovery-programme.schema.json"
      - "schemas/clinicaltrials-discovery-replay-input.schema.json"
      - "scripts/run_su_trials_recorded_replay.py"
      - "scripts/validate_clinicaltrials_discovery_programme.py"
      - "tests/test_su_trials_recorded_replay.py"
      - "tests/test_clinicaltrials_discovery_programme.py"
      - ".github/workflows/su-trials-recorded-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout observatory data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout exact proposed Workbench capability
        uses: actions/checkout@v4
        with:
          repository: fraware/neuroai-workbench
          ref: 1148d5edd532feedb697f02aa1de7128f87603c3
          path: .workbench
          persist-credentials: false

      - name: Install exact Workbench tree
        run: python -m pip install --disable-pip-version-check -e .workbench

      - name: Verify Workbench discovery capability and denominator option
        run: |
          python - <<'PY'
          from urllib.parse import parse_qs, urlparse
          from neuroai_workbench.collector.adapters.clinicaltrials import ClinicalTrialsGovAdapter
          from neuroai_workbench.discovery import project_clinicaltrials_search_pages

          assert callable(project_clinicaltrials_search_pages)
          adapter = ClinicalTrialsGovAdapter.__new__(ClinicalTrialsGovAdapter)
          params = parse_qs(urlparse(adapter.build_search_url("BCI", count_total=True)).query)
          assert params.get("countTotal") == ["true"]
          PY

      - name: Validate programme control
        run: python scripts/validate_clinicaltrials_discovery_programme.py

      - name: Run programme and replay unit tests
        run: |
          python -m unittest tests/test_clinicaltrials_discovery_programme.py
          python -m unittest tests/test_su_trials_recorded_replay.py

      - name: Exercise actual S1 projector against S2 known-source namespace
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import run_su_trials_recorded_replay as replay

          programme = replay._programme()
          stream = next(row for row in programme["query_streams"] if row["query_id"] == "DISCOVERY-CTGOV-BCI-001")
          bundle = {
              "schema_version": "0.1.0",
              "programme_id": programme["programme_id"],
              "capture_scope": "PARTIAL_VALIDATION",
              "captured_at": "2026-08-31T00:00:00Z",
              "api_data_timestamp": "2026-08-31",
              "query_captures": [{
                  "query_id": stream["query_id"],
                  "query_term": stream["query_term"],
                  "count_total_first_page_requested": True,
                  "count_total_later_pages_requested": False,
                  "pages": [{
                      "payload": {
                          "studies": [{
                              "protocolSection": {
                                  "identificationModule": {
                                      "nctId": "NCT04676854",
                                      "briefTitle": "PRIMAvera controlled integration fixture"
                                  },
                                  "statusModule": {
                                      "overallStatus": "ACTIVE_NOT_RECRUITING",
                                      "lastUpdatePostDateStruct": {"date": "2026-06-01"},
                                      "enrollmentInfo": {"count": 38}
                                  },
                                  "designModule": {"studyType": "INTERVENTIONAL", "phases": ["NA"]}
                              }
                          }],
                          "totalCount": 1
                      }
                  }]
              }]
          }
          result = replay.build_replay(bundle)
          assert result["reconciliation"]["materialized_source_namespace_count"] == 248
          assert result["reconciliation"]["known_controlled_duplicate_count"] == 1
          assert result["reconciliation"]["new_candidate_input_count"] == 0
          assert result["known_duplicates"][0]["record_key"] == "NCT04676854"
          assert result["known_duplicates"][0]["duplicate_of_source_id"] == "SRC-PR-002"
          assert result["query_reports"][0]["mechanical_blockers"] == []
          assert result["reconciliation"]["mechanically_complete"] is False
          PY

      - name: Verify no raw replay fixture is committed
        run: |
          if find . -path './.git' -prune -o -path './.workbench' -prune -o -type f \( -iname '*raw*clinicaltrials*' -o -iname '*ctgov*page*.json' \) -print | grep -q .; then
            echo "Raw ClinicalTrials.gov replay page material must remain external/ephemeral." >&2
            exit 1
          fi
