name: Runner availability diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu_2204:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        run: |
          echo "runner=ubuntu-22.04"
          python3 --version
          uname -a

  ubuntu_latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        run: |
          echo "runner=ubuntu-latest"
          python3 --version
          uname -a
