name: Runner availability diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/runner-availability-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu_slim:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        run: |
          echo "runner=ubuntu-slim"
          python3 --version
          uname -a

  ubuntu_2204:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        run: |
          echo "runner=ubuntu-22.04"
          python3 --version
          uname -a

  ubuntu_latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        run: |
          echo "runner=ubuntu-latest"
          python3 --version
          uname -a

  windows_latest:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        shell: pwsh
        run: |
          Write-Output "runner=windows-latest"
          python --version
          [System.Environment]::OSVersion.VersionString

  macos_latest:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        run: |
          echo "runner=macos-latest"
          python3 --version
          uname -a
